<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#eef2f7;color:#1e293b;padding-bottom:84px}
header{background:linear-gradient(135deg,#1e3a5f 0%,#0b1d33 100%);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:5;box-shadow:0 4px 14px rgba(11,29,51,.25);border-bottom:2px solid #c9a227}
header h1{font-size:17px;margin:0}
header small{opacity:.85;font-size:12px}
main{padding:12px}
nav{position:fixed;bottom:8px;left:8px;right:8px;display:flex;background:rgba(255,255,255,.96);border-radius:18px;box-shadow:0 8px 24px rgba(15,23,42,.18);z-index:5;padding:4px;overflow-x:auto}
nav:empty{display:none}
nav button{flex:1;min-width:52px;padding:9px 0;border:0;background:none;font-size:10px;color:#475569}
nav button.act{color:#fff;font-weight:bold;background:linear-gradient(135deg,#1e3a5f,#2d5a8c);border-radius:12px}
.fab{position:fixed;right:16px;bottom:90px;width:54px;height:54px;border-radius:50%;border:0;background:#c9a227;color:#0b1d33;font-size:30px;font-weight:bold;box-shadow:0 6px 16px rgba(0,0,0,.3);z-index:6}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(15,23,42,.06);border:1px solid #e2e8f0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:16px;padding:14px 10px;text-align:center;box-shadow:0 2px 8px rgba(15,23,42,.06);border-top:4px solid #c9a227}
.kpi b{font-size:22px;color:#1e3a5f;display:block}
.kpi span{font-size:12px;color:#64748b}
h2{font-size:18px;margin:4px 0 10px}
h3{font-size:15px;margin:4px 0 8px;color:#1e3a5f}
input,select,textarea{width:100%;padding:11px;margin:3px 0 10px;border:1px solid #cbd5e1;border-radius:12px;font-size:15px;background:#f8fafc;color:#1e293b}
input:focus,select:focus,textarea:focus{outline:none;border-color:#2d5a8c;background:#fff;box-shadow:0 0 0 3px rgba(45,90,140,.15)}
input[type=checkbox]{width:auto}
button.btn{background:linear-gradient(135deg,#1e3a5f,#2d5a8c);color:#fff;border:0;padding:12px 14px;border-radius:12px;font-size:15px;font-weight:600;width:100%;margin-top:6px;box-shadow:0 3px 8px rgba(30,58,95,.3)}
button.sec{background:#e2e8f0;color:#1e293b;box-shadow:none}
button.mini{background:#e2e8f0;border:0;padding:4px 8px;border-radius:6px;font-size:12px;margin-left:4px;color:#1e293b}
button.del{background:#fee2e2;color:#b91c1c;border:0;padding:4px 8px;border-radius:6px;font-size:12px;margin-left:4px}
.item{border-bottom:1px solid #e2e8f0;padding:9px 0;font-size:14px}
.item:last-child{border-bottom:0}
.meta{font-size:12px;color:#64748b}
.tag{display:inline-block;background:#e0f2fe;color:#075985;border-radius:999px;padding:2px 9px;font-size:11px;margin-right:4px;font-weight:600}
.tag.warn{background:#fef3c7;color:#92400e}
.tag.ok{background:#dcfce7;color:#166534}
.tag.red{background:#fee2e2;color:#b91c1c}
.bar{background:#e2e8f0;border-radius:999px;height:10px;overflow:hidden;margin:6px 0}
.bar div{background:linear-gradient(90deg,#c9a227,#16a34a);height:100%;border-radius:999px}
.persp{border-left:4px solid #1e3a5f;padding-left:10px;margin-bottom:12px}
.persp p{margin:4px 0;font-size:14px}
.late{color:#dc2626;font-weight:bold}
.empty{color:#94a3b8;font-size:14px;text-align:center;padding:10px}
.err{color:#b91c1c;font-size:14px;min-height:18px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.pres .sens{filter:blur(6px);user-select:none}
.avatar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:10px}
body.priv main{filter:blur(14px)}
body.dark{background:#0f172a;color:#e2e8f0}
body.dark .card,body.dark .kpi{background:#1e293b;border-color:#334155;color:#e2e8f0}
body.dark input,body.dark select,body.dark textarea{background:#0f172a;color:#e2e8f0;border-color:#334155}
body.dark nav{background:rgba(30,41,59,.96)}
body.dark nav button{color:#cbd5e1}
body.dark button.mini,body.dark button.sec{background:#334155;color:#e2e8f0}
body.dark .kpi b,body.dark h3{color:#93c5fd}
body.dark .item{border-color:#334155}
body.ro .fab{display:none!important}
body.ro main button:not(.permite){display:none}
body.ro main input:not(.permite),body.ro main select:not(.permite),body.ro main textarea:not(.permite){pointer-events:none;opacity:.6}
@media print{header,nav,.fab,button,input,select,textarea,.noprint{display:none!important}body{background:#fff;padding:0}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<header>
  <h1>CMI Psicólogo PIE</h1>
  <small id="hdrSub"></small>
</header>
<main id="app"></main>
<button class="fab noprint" id="fab" onclick="nuevaAtencion()" title="Nueva atención">+</button>
<nav id="nav" class="noprint"></nav>
<script>
const PKEY='cmi_pie_perfiles_v3', VKEY_LEGACY='cmi_pie_franco_vault_v2', RKEY='cmi_pie_recursos_genericos';
let PID=null, S=null, CK=null, SALT=null, cur='inicio', timer=null, DRAFT='', FILT={txt:'',tipo:'',mes:'',pr:''}, FD='', FH='', ORDEN='codigo', FICHA=null, VERCONF=false, PRES=false, IMPQ=null, FICHA_SES=null;
const MIN_INACTIVO=5*60*1000, PLAZO_DEFAULT_MESES=24;
const TIPOS_NEE=['TEA','TDAH','Discapacidad Intelectual','Trastorno Específico del Lenguaje (TEL)','Discapacidad Auditiva','Discapacidad Visual','Disfasia','Funcionamiento Intelectual Limítrofe','Dificultades Específicas del Aprendizaje (DEA)','Trastorno de Déficit Atencional','Otra'];
const TIPOS_ATENCION=['Intervención individual','Intervención grupal','Evaluación psicoeducativa','Entrevista familia','Coordinación docente','Observación de aula','Capacitación / Formación','Otra'];
const DOMINIOS=['Aprendizaje','Comunicación y lenguaje','Atención y funciones ejecutivas','Relaciones con pares y adultos','Regulación emocional y conducta','Autonomía y vida diaria','Participación escolar'];
const NIV_DIF=['0 Sin dificultad','1 Leve','2 Moderada','3 Severa','4 Muy severa'];
const NIV_APO=['0 Ninguno','1 Puntual','2 Intermitente','3 Extenso','4 Permanente'];
const ESTADOS_CASO=['Abierto','En seguimiento','Derivado','Cerrado'];
const AREAS_META=['Lectura','Escritura','Matemática','Socioemocional','Autonomía','Comunicación','Conductual'];
const RESP_META=['Psicólogo PIE','Educadora diferencial','Docente de aula','Familia','Fonoaudiólogo','Otro'];
const ESTADOS_OBJ=['No iniciado','En proceso','Logrado','Modificado','Suspendido'];
function revVencida(g){ return !!g.rev && diasDesde(g.rev)>30 && g.st!=='Logrado' && g.st!=='Suspendido'; }
/* ===== utilidades ===== */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hoy(){ return new Date().toISOString().slice(0,10); }
function fmtF(f){ return f?f.split('-').reverse().join('-'):'—'; }
function mesActual(){ return hoy().slice(0,7); }
function diasDesde(f){ return Math.floor((new Date(hoy())-new Date(f))/86400000); }
function opts(arr,sel){ return arr.map(o=>`<option ${o===sel?'selected':''}>${esc(o)}</option>`).join(''); }
function getPerfiles(){ try{return JSON.parse(localStorage.getItem(PKEY))||[];}catch(e){return [];} }
function setPerfiles(l){ localStorage.setItem(PKEY,JSON.stringify(l)); }
function perfilActual(){ return getPerfiles().find(p=>p.id===PID); }
function vk(){ return (perfilActual()||{}).vk||VKEY_LEGACY; }
function cfg(){ S.cfg=S.cfg||{nivel:'estandar',plazoMeses:PLAZO_DEFAULT_MESES}; return S.cfg; }
function nivelOk(n){ const o={basico:0,estandar:1,completo:2}; return o[cfg().nivel]>=o[n]; }
function addMeses(f,m){ if(!f) return ''; const d=new Date(f+'T00:00:00'); d.setMonth(d.getMonth()+m); return d.toISOString().slice(0,10); }
function vencimientoEval(s){ return s.fechaReeval||(s.fechaEval?addMeses(s.fechaEval,cfg().plazoMeses):''); }
function nombreEst(id){ const e=(S.students||[]).find(x=>x.id===id); return e?e.codigo:'—'; }
function setHdr(){
  const p=perfilActual();
  document.getElementById('hdrSub').textContent=p?[p.nombre,p.cargo,p.establecimiento,p.anio?'Año '+p.anio:''].filter(Boolean).join(' · '):'CMI PIE';
  document.body.classList.toggle('dark',!!(S&&S.cfg&&S.cfg.oscuro));
  document.body.classList.toggle('ro',!!(S&&S.cfg&&S.cfg.soloLectura));
}
/* ===== avatar del perfil (P.12) ===== */
function avatarHTML(p,size){
  const nom=(p&&p.nombre)||'?';
  const ini=nom.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'?';
  let h=0; for(const ch of nom) h=(h*31+ch.charCodeAt(0))%360;
  return `<span style="display:inline-flex;align-items:center;justify-content:center;width:${size}px;height:${size}px;border-radius:50%;background:linear-gradient(135deg,hsl(${h},55%,38%),hsl(${h},55%,25%));color:#fff;font-weight:700;font-size:${Math.round(size*0.38)}px;border:2px solid #c9a227;flex-shrink:0;vertical-align:middle">${esc(ini)}</span>`;
}
/* ===== criptografía ===== */
const enc=new TextEncoder(), dec=new TextDecoder();
function b64(buf){ const b=new Uint8Array(buf); let s=''; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function unb64(s){ return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); }
async function deriveKey(pin,salt){
  const base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function cifrar(clave,texto){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},clave,enc.encode(texto)); return {iv:b64(iv),ct:b64(ct)}; }
async function descifrar(clave,ivB,ctB){ return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(ivB)},clave,unb64(ctB))); }
function pinValido(p){ return /^\d{6,12}$/.test(p); }
async function guardar(){ const c=await cifrar(CK,JSON.stringify(S)); localStorage.setItem(vk(),JSON.stringify({v:2,salt:SALT,iv:c.iv,ct:c.ct})); }
function save(){ guardar().catch(()=>alert('No se pudo guardar de forma cifrada.')); }
/* ===== acceso, perfiles, PIN ===== */
function boot(){
  if(!localStorage.getItem(PKEY)&&localStorage.getItem(VKEY_LEGACY)) setPerfiles([{id:'franco',nombre:'Franco Espinoza Aparicio',cargo:'Psicólogo PIE',vk:VKEY_LEGACY,fallos:0,bloqueadoHasta:0}]);
  const l=getPerfiles();
  if(!l.length){ showSetup(); return; }
  if(l.length===1){ PID=l[0].id; showLock(); return; }
  showPerfiles();
}
function renderNav(on){
  setHdr();
  document.getElementById('fab').style.display=on?'block':'none';
  document.getElementById('nav').innerHTML=on?Object.keys(vistas).map(k=>`<button class="${k===cur?'act':''}" onclick="go('${k}')">${vistas[k].i}<br>${vistas[k].t}</button>`).join(''):'';
}
function showSetup(){
  S=null; CK=null; renderNav(false);
  document.getElementById('app').innerHTML=`<div class="card"><h2>Nuevo perfil</h2>
    <input id="pNom" placeholder="Nombre (ej. Ana Pérez)">
    <input id="pCar" placeholder="Cargo (ej. Psicóloga PIE)">
    <input id="pEst" placeholder="Establecimiento (opcional)">
    <input id="pAnio" placeholder="Año escolar (ej. 2026)">
    <p class="meta">El PIN abre la app y cifra tus datos en este equipo. Si lo olvidas, los datos no se pueden recuperar, por eso conviene hacer respaldos cifrados.</p>
    <input id="pin1" type="password" inputmode="numeric" maxlength="12" placeholder="PIN (6 a 12 números)">
    <input id="pin2" type="password" inputmode="numeric" maxlength="12" placeholder="Repite el PIN">
    <p class="err" id="pinErr"></p>
    <button class="btn" onclick="crearPin()">Crear PIN y comenzar</button></div>`;
}
async function crearPin(){
  const p1=document.getElementById('pin1').value, p2=document.getElementById('pin2').value, err=document.getElementById('pinErr');
  if(!pinValido(p1)){ err.textContent='El PIN debe tener entre 6 y 12 números.'; return; }
  if(p1!==p2){ err.textContent='Los PIN no coinciden.'; return; }
  const salt=crypto.getRandomValues(new Uint8Array(16));
  SALT=b64(salt); CK=await deriveKey(p1,salt);
  const id=uid(), lista=getPerfiles();
  lista.push({id,nombre:(document.getElementById('pNom').value||'').trim()||'Sin nombre',cargo:document.getElementById('pCar').value.trim(),establecimiento:document.getElementById('pEst').value.trim(),anio:document.getElementById('pAnio').value.trim(),vk:'cmi_pie_vault_'+id,fallos:0,bloqueadoHasta:0});
  setPerfiles(lista); PID=id;
  S={students:[],sessions:[],goals:[],meetings:[],tasks:[],cases:[],plan:[],formacion:0,cfg:{nivel:'estandar',plazoMeses:PLAZO_DEFAULT_MESES}};
  await guardar(); iniciarSesion();
}
function showPerfiles(){
  S=null; CK=null; PID=null; clearTimeout(timer); renderNav(false);
  const l=getPerfiles();
  document.getElementById('app').innerHTML=`<div class="card"><h2>Perfiles</h2>
    <p class="meta">Cada perfil tiene su propio PIN y sus datos cifrados.</p>
    ${l.map(p=>`<div class="item">${avatarHTML(p,36)} <button class="btn" style="width:auto;display:inline-block;margin-top:0" onclick="elegirPerfil('${p.id}')">${esc(p.nombre)}${p.cargo?' · '+esc(p.cargo):''}</button><button class="mini" onclick="editarPerfil('${p.id}')">Editar</button><button class="del" onclick="eliminarPerfil('${p.id}')">Eliminar</button></div>`).join('')}
    <button class="btn sec" onclick="showSetup()">+ Nuevo perfil</button>
    <button class="btn sec" onclick="importarPerfil()">Importar perfil desde otro equipo</button></div>`;
}
function elegirPerfil(id){ PID=id; showLock(); }
function editarPerfil(id){
  const l=getPerfiles(), p=l.find(x=>x.id===id); if(!p) return;
  const n=prompt('Nombre del perfil:',p.nombre); if(n===null) return;
  const c=prompt('Cargo:',p.cargo||''); if(c===null) return;
  const e=prompt('Establecimiento (opcional):',p.establecimiento||''); if(e===null) return;
  const a=prompt('Año escolar:',p.anio||''); if(a===null) return;
  p.nombre=n.trim()||p.nombre; p.cargo=c.trim(); p.establecimiento=e.trim(); p.anio=a.trim();
  setPerfiles(l); showPerfiles();
}
async function eliminarPerfil(id){
  const p=getPerfiles().find(x=>x.id===id); if(!p) return;
  const pin=prompt('Para eliminar "'+p.nombre+'" ingresa su PIN:'); if(pin===null) return;
  try{ const v=JSON.parse(localStorage.getItem(p.vk)); if(v){ const k=await deriveKey(pin,unb64(v.salt)); await descifrar(k,v.iv,v.ct); } }
  catch(e){ alert('PIN incorrecto.'); return; }
  if(!confirm('Esta acción borra todos los datos de este perfil y no se puede deshacer. ¿Continuar?')) return;
  localStorage.removeItem(p.vk); localStorage.removeItem(p.vk+'_prev');
  setPerfiles(getPerfiles().filter(x=>x.id!==id)); showPerfiles();
}
function olvidePin(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    try{
      const obj=JSON.parse(await f.text());
      if(obj.formato!=='cmi-pie-respaldo') throw new Error('formato');
      const pw=prompt('Contraseña de ese respaldo:'); if(pw===null) return;
      const datos=JSON.parse(await descifrar(await deriveKey(pw,unb64(obj.salt)),obj.iv,obj.ct));
      const p1=prompt('Nuevo PIN para este perfil (6 a 12 números):'); if(p1===null) return;
      if(!pinValido(p1)){ alert('El PIN debe tener entre 6 y 12 números.'); return; }
      const p2=prompt('Repite el nuevo PIN:'); if(p1!==p2){ alert('Los PIN no coinciden.'); return; }
      const salt=crypto.getRandomValues(new Uint8Array(16));
      SALT=b64(salt); CK=await deriveKey(p1,salt);
      S={students:[],sessions:[],goals:[],meetings:[],tasks:[],cases:[],plan:[],formacion:0,...datos};
      await guardar(); S=null; CK=null;
      alert('PIN restablecido. Ingresa con el nuevo PIN.'); showLock();
    }catch(e){ alert('No se pudo restablecer: respaldo no válido o contraseña incorrecta.'); }
  };
  inp.click();
}
function cambiarPerfil(){ showPerfiles(); }
function showLock(){
  S=null; CK=null; DRAFT=''; clearTimeout(timer); renderNav(false);
  document.getElementById('app').innerHTML=`<div class="card"><h2>App bloqueada</h2>
    <p class="meta">Ingresa el PIN de este perfil.</p>
    <button class="btn sec" onclick="showPerfiles()">Cambiar perfil</button>
    <button class="mini" onclick="olvidePin()">¿Olvidaste el PIN? Restablecer con respaldo</button>
    <input id="pin" type="password" inputmode="numeric" maxlength="12" placeholder="PIN" onkeydown="if(event.key==='Enter')desbloquear()">
    <button class="btn" onclick="desbloquear()">Desbloquear</button>
    <p class="err" id="pinErr"></p></div>`;
}
async function desbloquear(){
  const pin=document.getElementById('pin').value, err=document.getElementById('pinErr');
  if(!pinValido(pin)){ err.textContent='El PIN debe tener entre 6 y 12 números.'; return; }
  try{
    const pf=perfilActual();
    if(pf&&pf.bloqueadoHasta>Date.now()){ err.textContent='Espera '+Math.ceil((pf.bloqueadoHasta-Date.now())/1000)+' s antes de reintentar.'; return; }
    const v=JSON.parse(localStorage.getItem(vk()));
    const clave=await deriveKey(pin,unb64(v.salt));
    S=JSON.parse(await descifrar(clave,v.iv,v.ct)); CK=clave; SALT=v.salt;
    const lp=getPerfiles(), qp=lp.find(x=>x.id===PID); if(qp){ qp.fallos=0; qp.bloqueadoHasta=0; setPerfiles(lp); }
    iniciarSesion();
  }catch(e){
    const lp=getPerfiles(), qp=lp.find(x=>x.id===PID);
    if(qp){ qp.fallos=(qp.fallos||0)+1; if(qp.fallos>=5) qp.bloqueadoHasta=Date.now()+Math.min(600,30*(qp.fallos-4))*1000; setPerfiles(lp); }
    err.textContent='PIN incorrecto.'+(qp&&qp.fallos>=5?' Espera antes de reintentar.':'');
  }
}
function iniciarSesion(){ registrar('Acceso a la app'); cur='inicio'; render(); resetTimer(); chequearNotif(); }
function bloquear(){ showLock(); }
function resetTimer(){ clearTimeout(timer); if(CK) timer=setTimeout(bloquear,MIN_INACTIVO); }
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,resetTimer));
async function cambiarPin(){
  if(!CK) return;
  const p1=prompt('Nuevo PIN (6 a 12 números):'); if(p1===null) return;
  if(!pinValido(p1)){ alert('El PIN debe tener entre 6 y 12 números.'); return; }
  const p2=prompt('Repite el nuevo PIN:'); if(p1!==p2){ alert('Los PIN no coinciden.'); return; }
  const salt=crypto.getRandomValues(new Uint8Array(16)); SALT=b64(salt); CK=await deriveKey(p1,salt);
  await guardar(); alert('PIN cambiado correctamente.');
}
/* ===== navegación ===== */
const vistas={inicio:{t:'Inicio',i:'📊'},estudiantes:{t:'Estudiantes',i:'👦'},atenciones:{t:'Atenciones',i:'📝'},planes:{t:'Metas',i:'🎯'},familias:{t:'Familias',i:'👪'},tareas:{t:'Tareas',i:'✅'},casos:{t:'Casos',i:'🧭'},informes:{t:'Informes',i:'📄'},planif:{t:'Plan',i:'🗓️'},respaldo:{t:'Ajustes',i:'⚙️'}};
const FN={inicio:vInicio,estudiantes:vEst,atenciones:vAt,planes:vPlanes,familias:vFam,tareas:vTar,casos:vCasos,informes:vInf,planif:vPlanif,respaldo:vRes,ficha:vFicha,infest:vInfEst,recursos:vRec};
function render(){
  if(!S) return;
  renderNav(true);
  document.getElementById('app').innerHTML=(FN[cur]||vInicio)();
  bindSwipe();
}
function go(v,push=true){
  if(cur==='atenciones'&&DRAFT&&v!==cur&&!confirm('Tienes una atención sin guardar. ¿Salir igual?')) return;
  if(cur==='estudiantes'&&v!==cur&&(document.getElementById('e_cod')||{}).value&&!confirm('Tienes un estudiante sin guardar. ¿Salir igual?')) return;
  cur=v; if(push&&history.pushState) history.pushState({v},'');
  render(); window.scrollTo(0,0); resetTimer();
}
window.addEventListener('popstate',()=>{ if(S&&cur!=='inicio'){ cur='inicio'; render(); } });
function nuevaAtencion(){ if(!S) return; go('atenciones'); setTimeout(()=>{const el=document.getElementById('a_desc'); if(el) el.focus();},60); }
/* ===== notificaciones (solo con la app abierta) ===== */
function alertasCount(){ return S?contarAlertas().length:0; }
function activarNotif(){
  if(!('Notification' in window)){ alert('Este navegador no admite notificaciones.'); return; }
  Notification.requestPermission().then(p=>alert(p==='granted'?'Notificaciones activadas.':'Notificaciones no permitidas.'));
}
function chequearNotif(){
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  const a=contarAlertas(); if(a.length) new Notification('CMI PIE',{body:a.length+' alerta(s) pendiente(s)'});
}
/* ===== alertas e inicio ===== */
function contarAlertas(){
  const a=[], activos=S.students.filter(s=>s.estado==='Activo');
  const vencidas=S.tasks.filter(t=>!t.done&&t.vence&&t.vence<hoy()).length;
  if(vencidas) a.push(vencidas+' tarea(s) vencida(s)');
  const lim30=new Date(Date.now()+30*86400000).toISOString().slice(0,10);
  const reev=activos.filter(s=>{const v=vencimientoEval(s); return v&&v>=hoy()&&v<=lim30;});
  if(reev.length) a.push(reev.length+' evaluación(es) vencen en 30 días');
  const metasVenc=S.goals.filter(g=>g.plazo&&g.plazo<hoy()&&g.progreso<100).length;
  if(metasVenc) a.push(metasVenc+' meta(s) con plazo vencido');
  const metasSinRev=S.goals.filter(revVencida).length;
  if(metasSinRev) a.push(metasSinRev+' meta(s) sin revisión hace más de 30 días');
  const sinAt=activos.filter(s=>!ultimaAt(s.id)||diasDesde(ultimaAt(s.id))>30);
  if(sinAt.length) a.push(sinAt.length+' estudiante(s) sin atención hace más de 30 días');
  const chkInc=activos.filter(s=>!checkOk(s)).length;
  if(chkInc) a.push(chkInc+' estudiante(s) con checklist normativo incompleto');
  const casos=(S.cases||[]).filter(c=>c.riesgo&&c.estado!=='Cerrado').length;
  if(casos) a.push(casos+' caso(s) de riesgo abiertos');
  const lim=addMeses(hoy(),-(cfg().retMeses||60));
  const ret=activos.length<S.students.length?S.students.filter(s=>s.estado!=='Activo'&&s.fEst&&s.fEst<=lim).length:0;
  if(ret) a.push(ret+' egresado(s)/retirado(s) superan el plazo de retención');
  const rp=cfg().ultimoRespaldo; if(!rp||diasDesde(rp)>14) a.push('Recuerda hacer un respaldo cifrado (hace más de 14 días)');
  return a;
}
function ultimaAt(sid){ const u=S.sessions.filter(x=>x.estudiante===sid).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0]; return u?u.fecha:''; }
function checkOk(s){ const c=s.chk||{}; return !!(c.eval&&c.inf&&c.cons&&c.reun); }
function buscarGlobal(q){
  q=(q||'').trim().toLowerCase(); const el=document.getElementById('res');
  if(!el) return;
  if(!q){ el.innerHTML=''; return; }
  const ests=S.students.filter(s=>(s.codigo+' '+s.curso+' '+s.nee).toLowerCase().includes(q)).slice(0,8);
  const ats=S.sessions.filter(s=>(nombreEst(s.estudiante)+' '+s.tipo+' '+s.desc).toLowerCase().includes(q)).slice(0,8);
  el.innerHTML=(ests.map(s=>`<div class="item"><button class="mini" onclick="verFicha('${s.id}')">Ficha</button> <b>${esc(s.codigo)}</b> <span class="meta">${esc(s.curso)} · ${esc(s.nee)}</span></div>`).join('')
    +ats.map(a=>`<div class="item"><span class="meta">${esc(a.fecha)} · ${esc(nombreEst(a.estudiante))} · ${esc(a.tipo)}</span><br><span class="sens">${esc(a.desc)}</span></div>`).join(''))||'<p class="empty">Sin resultados.</p>';
}
function vInicio(){
  const activos=S.students.filter(s=>s.estado==='Activo');
  const atMes=S.sessions.filter(s=>s.fecha.startsWith(mesActual()));
  const avgMetas=S.goals.length?Math.round(S.goals.reduce((a,g)=>a+g.progreso,0)/S.goals.length):0;
  const metasLogradas=S.goals.filter(g=>g.progreso>=100).length;
  const reunRe=S.meetings.filter(r=>r.estado==='Realizada').length;
  const pctReun=S.meetings.length?Math.round(reunRe/S.meetings.length*100):0;
  const tHechas=S.tasks.filter(t=>t.done).length;
  const pctTareas=S.tasks.length?Math.round(tHechas/S.tasks.length*100):0;
  const conNotas=S.sessions.filter(s=>s.desc&&s.desc.trim().length>10).length;
  const pctNotas=S.sessions.length?Math.round(conNotas/S.sessions.length*100):0;
  const sinAt=activos.filter(s=>!ultimaAt(s.id)||diasDesde(ultimaAt(s.id))>30);
  const formacion=S.sessions.filter(s=>s.tipo==='Capacitación / Formación').reduce((a,s)=>a+(+s.duracion||0),0)/60;
  const alertas=contarAlertas();
  const h=new Date().getHours(), saludo=h<12?'Buenos días':h<20?'Buenas tardes':'Buenas noches';
  const fechaTxt=new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});
  const p=perfilActual()||{nombre:''};
  return `
  <div class="card" style="background:linear-gradient(135deg,#1e3a5f,#2d5a8c);color:#fff;border:0">
    <div style="font-size:13px;opacity:.85">${saludo}</div>
    <div style="display:flex;align-items:center;gap:12px">${avatarHTML(p,52)}<div style="font-size:19px;font-weight:700">Hola, ${esc(p.nombre.split(' ')[0])}</div></div>
    <div style="font-size:13px;margin-top:4px;opacity:.9;text-transform:capitalize">${fechaTxt}</div>
  </div>
  <div class="card"><input class="permite" placeholder="Buscar estudiante, atención o texto" oninput="buscarGlobal(this.value)"><div id="res"></div></div>
  <div class="card" style="border-left:4px solid #c9a227"><h3>Alertas del día</h3>
    ${alertas.length?alertas.map(a=>`<p style="margin:5px 0;font-size:14px">• ${esc(a)}</p>`).join(''):'<p class="empty">Sin alertas pendientes ✔</p>'}
    <button class="mini" onclick="activarNotif()">Activar notificaciones</button></div>
  <div class="card"><h3>Cumplimiento normativo global</h3>${(()=>{const a=activos.length, ok=activos.filter(checkOk).length, p=a?Math.round(ok/a*100):0; return `<p>Estudiantes con checklist completo: <b>${p}%</b> (${ok} de ${a})</p><div class="bar"><div style="width:${p}%"></div></div>`;})()}</div>
  ${hoyHTML()}
  ${resumenSemanaHTML()}
  <div class="kpis">
    <div class="kpi"><b>${activos.length}</b><span>Estudiantes PIE activos</span></div>
    <div class="kpi"><b>${atMes.length}</b><span>Atenciones este mes</span></div>
    <div class="kpi"><b>${avgMetas}%</b><span>Avance promedio de metas</span></div>
    <div class="kpi"><b>${S.tasks.filter(t=>!t.done&&t.vence&&t.vence<hoy()).length}</b><span>Tareas vencidas</span></div>
    <div class="kpi"><b>${(()=>{const t=(S.plan||[]).reduce((a,p)=>a+(+p.min||0),0);const d=(S.plan||[]).filter(p=>p.tipo==='Atención directa').reduce((a,p)=>a+(+p.min||0),0);return t?Math.round(d/t*100):0;})()}%</b><span>Jornada en atención directa</span></div>
  </div>
  <h2>Cuadro de Mando Integral</h2>
  <div class="card persp"><h3>1. Estudiantes (impacto)</h3>
    <p>Metas logradas: <b>${metasLogradas}</b> de ${S.goals.length}</p>
    <div class="bar"><div style="width:${avgMetas}%"></div></div>
    <p class="meta">Meta sugerida: ≥ 70% de avance al cierre de semestre.</p></div>
  <div class="card persp"><h3>2. Procesos internos</h3>
    <p>Atenciones registradas: <b>${S.sessions.length}</b></p>
    <p>Con descripción completa: <b>${pctNotas}%</b></p>
    <p>Activos sin atención en 30 días: <b class="${sinAt.length?'late':''}">${sinAt.length}</b></p>
    <p>Checklist normativo completo: <b>${activos.filter(checkOk).length}</b> de ${activos.length}</p></div>
  <div class="card persp"><h3>3. Familias y comunidad</h3>
    <p>Reuniones realizadas: <b>${reunRe}</b> de ${S.meetings.length}</p>
    <div class="bar"><div style="width:${pctReun}%"></div></div></div>
  <div class="card persp"><h3>4. Aprendizaje y desarrollo profesional</h3>
    <p>Horas de formación: <b>${formacion.toFixed(1)}</b></p>
    <p>Tareas completadas: <b>${pctTareas}%</b></p>
    <div class="bar"><div style="width:${pctTareas}%"></div></div></div>`;
}
/* ===== resumen del día y accesos rápidos (bloque 1) ===== */
function resumenHoy(){
  const h=hoy();
  const reun=S.meetings.filter(r=>r.fecha===h&&r.estado!=='Cancelada');
  const ats=S.sessions.filter(s=>s.fecha===h&&s.es==='Programada');
  const tar=S.tasks.filter(t=>!t.done&&t.vence===h);
  const act=S.students.filter(s=>s.estado==='Activo');
  return {reun,ats,tar,chk:act.filter(checkOk).length,n:act.length};
}
function hoyHTML(){
  const r=resumenHoy();
  return `<div class="card"><h3>Hoy</h3>
    <p>Reuniones: <b>${r.reun.length}</b> · Atenciones programadas: <b>${r.ats.length}</b> · Tareas para hoy: <b>${r.tar.length}</b></p>
    <p>Checklist normativo completo: <b>${r.chk}</b> de ${r.n} estudiantes activos</p></div>`;
}
function resumenSemanaHTML(){
  const d=new Date(); const dow=(d.getDay()+6)%7;
  const lun=new Date(d); lun.setDate(d.getDate()-dow);
  const dom=new Date(lun); dom.setDate(lun.getDate()+6);
  const iso=x=>x.toISOString().slice(0,10);
  const ini=iso(lun), fin=iso(dom);
  const en=f=>!!f&&f>=ini&&f<=fin;
  const reun=S.meetings.filter(r=>en(r.fecha)&&r.estado==='Programada').length;
  const atProg=S.sessions.filter(s=>en(s.fecha)&&s.es==='Programada').length;
  const atReal=S.sessions.filter(s=>en(s.fecha)&&s.fecha<=hoy()).length;
  const tar=S.tasks.filter(t=>!t.done&&en(t.vence)).length;
  return `<div class="card"><h3>Resumen de la semana</h3>
    <p>Del ${fmtF(ini)} al ${fmtF(fin)}:</p>
    <p>Reuniones programadas: <b>${reun}</b> · Atenciones programadas: <b>${atProg}</b></p>
    <p>Atenciones registradas hasta hoy: <b>${atReal}</b> · Tareas que vencen esta semana: <b>${tar}</b></p></div>`;
}
function filtrarEst(q){
  const sel=document.getElementById('a_e'); if(!sel) return;
  q=(q||'').trim().toLowerCase();
  sel.innerHTML='<option value="">— Sin estudiante específico —</option>'+S.students.filter(s=>(s.codigo+' '+s.nee).toLowerCase().includes(q)).map(s=>`<option value="${s.id}">${esc(s.codigo)} - ${esc(s.nee)}</option>`).join('');
}
function recientesHTML(){
  const ids=[...new Set([...S.sessions].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(s=>s.estudiante).filter(Boolean))].slice(0,5);
  if(!ids.length) return '';
  return '<p class="meta">Recientes:</p><div class="row" style="flex-wrap:wrap">'+ids.map(id=>`<button class="mini" type="button" onclick="document.getElementById('a_e').value='${id}'">${esc(nombreEst(id))}</button>`).join('')+'</div>';
}
/* ===== semáforo y checklist ===== */
function semaforo(s){
  const venc=vencimientoEval(s);
  if(!venc) return '<span class="tag warn">Sin fecha de evaluación</span>';
  const d=Math.ceil((new Date(venc)-new Date(hoy()))/86400000);
  const rojo='background:#fee2e2;color:#b91c1c';
  if(d<0) return '<span class="tag" style="'+rojo+'">Vencida</span>';
  if(d<=7) return '<span class="tag" style="'+rojo+'">Vence en '+d+' d (alerta 7)</span>';
  if(d<=30) return '<span class="tag warn">Vence en '+d+' d (alerta 30)</span>';
  if(d<=60) return '<span class="tag" style="background:#fef9c3;color:#854d0e">Vence en '+d+' d (alerta 60)</span>';
  return '<span class="tag ok">Vigente ('+d+' d)</span>';
}
function vChecklist(s){
  const c=s.chk||{}, inf=c.inf?` (${esc(c.infFecha||'sin fecha')} → ${esc(c.infDest||'sin destinatario')})`:'';
  const item=(k,txt)=>`<div class="item"><label><input type="checkbox" ${c[k]?'checked':''} onchange="chkToggle('${s.id}','${k}')"> ${txt}</label></div>`;
  return `<div class="card"><h3>Checklist normativo ${checkOk(s)?'<span class="tag ok">Completo</span>':'<span class="tag warn">Incompleto</span>'}</h3>
  ${item('eval','Evaluación psicoeducativa realizada')}
  ${item('inf','Informe psicoeducativo entregado'+inf)}
  ${item('cons','Consentimiento firmado por apoderado')}
  ${item('reun','Reunión con apoderado realizada')}</div>`;
}
function chkToggle(sid,k){
  const s=S.students.find(x=>x.id===sid); s.chk=s.chk||{};
  if(k==='inf'&&!s.chk.inf){
    const f=prompt('Fecha de entrega del informe (AAAA-MM-DD):',hoy()); if(f===null) return;
    const d=prompt('Destinatario (ej. familia, UTP, dirección):',''); if(d===null) return;
    s.chk.infFecha=f.trim(); s.chk.infDest=d.trim(); s.chk.inf=true;
  } else if(k==='inf'){ s.chk.inf=false; }
  else s.chk[k]=!s.chk[k];
  save(); render();
}
/* ===== estudiantes ===== */
let ORD_LISTA=(a,b)=>a.codigo.localeCompare(b.codigo);
function vEst(){
  const ord=ORDEN==='curso'?(a,b)=>(a.curso||'').localeCompare(b.curso||''):ORD_LISTA;
  const lista=[...S.students].sort(ord).map(s=>`
    <div class="item"><b>${esc(s.codigo)}</b> <span class="tag">${esc(s.curso)}</span>
      <span class="tag ${s.estado==='Activo'?'ok':'warn'}">${esc(s.estado)}</span><br>
      <span class="meta">${esc(s.nee)} · Evaluado: ${esc(s.fechaEval||'—')} · Reevaluación: ${esc(s.fechaReeval||'—')}</span> ${semaforo(s)}
      <div style="margin-top:4px">
        <button class="mini" onclick="verFicha('${s.id}')">Ficha</button>
        <button class="mini" onclick="cambiarEstado('${s.id}')">Cambiar estado</button>
        <button class="del" onclick="borrar('students','${s.id}')">Eliminar</button>
      </div></div>`).join('')||'<p class="empty">Sin estudiantes registrados.</p>';
  return `
  <h2>Estudiantes PIE</h2>
  <div class="card">
    <select onchange="ORDEN=this.value;render()"><option value="codigo" ${ORDEN==='codigo'?'selected':''}>Ordenar por código</option><option value="curso" ${ORDEN==='curso'?'selected':''}>Ordenar por curso</option></select>
  </div>
  <div class="card">
    <h3>Nuevo estudiante</h3>
    <p class="meta">Usa código o iniciales, no nombres completos.</p>
    <input id="e_cod" placeholder="Código o iniciales (ej: M.G.R.)">
    <div class="row"><input id="e_curso" placeholder="Curso (ej: 3° Básico B)"><select id="e_estado"><option>Activo</option><option>Egresado</option><option>Retirado</option></select></div>
    <select id="e_nee">${opts(TIPOS_NEE,'')}</select>
    <div class="row"><div><small class="meta">Fecha evaluación</small><input type="date" id="e_fe"></div><div><small class="meta">Fecha reevaluación</small><input type="date" id="e_fr"></div></div>
    <textarea id="e_obs" rows="2" placeholder="Observaciones generales"></textarea>
    <input id="e_prof" placeholder="Profesional que evaluó">
    <input id="e_inst" placeholder="Instrumentos, versión y fecha (ej: WISC-V, ENI)">
    <select id="e_elig"><option>Pendiente</option><option>Cumple criterios</option><option>No cumple</option></select>
    <input id="e_der" placeholder="Derivación a especialista (ej: neurólogo)">
    <div><small class="meta">Fecha de envío de derivación</small><input type="date" id="e_fder"></div>
    <textarea id="e_conf" rows="2" placeholder="Observaciones confidenciales (solo en ficha, oculto por defecto)"></textarea>
    <button class="btn" onclick="addEst()">Guardar estudiante</button>
  </div>
  <div class="card"><h3>Importar desde CSV</h3>
    <p class="meta">Exporta tu planilla de Excel a CSV (Archivo → Guardar como → CSV). Columnas: codigo, curso, estado, nee, fechaEval, fechaReeval, obs. Los códigos repetidos se omiten.</p>
    <input type="file" accept=".csv,text/csv" onchange="leerCSV(this)">
    <div id="impPrev"></div></div>
  <div class="card">${lista}</div>`;
}
function addEst(){
  const cod=document.getElementById('e_cod').value.trim();
  if(!cod){ alert('Ingresa un código o iniciales'); return; }
  if(S.students.some(x=>x.codigo.toLowerCase()===cod.toLowerCase())){ alert('Ya existe un estudiante con ese código.'); return; }
  const fe0=document.getElementById('e_fe').value, fr0=document.getElementById('e_fr').value;
  if(fe0&&fe0>hoy()){ alert('La fecha de evaluación no puede ser futura.'); return; }
  if(fe0&&fr0&&fr0<fe0){ alert('La fecha de reevaluación no puede ser anterior a la evaluación.'); return; }
  S.students.push({id:uid(),codigo:cod,curso:document.getElementById('e_curso').value.trim(),estado:document.getElementById('e_estado').value,nee:document.getElementById('e_nee').value,fechaEval:document.getElementById('e_fe').value,fechaReeval:document.getElementById('e_fr').value,obs:document.getElementById('e_obs').value.trim(),prof:document.getElementById('e_prof').value.trim(),inst:document.getElementById('e_inst').value.trim(),elig:document.getElementById('e_elig').value,der:document.getElementById('e_der').value.trim(),fder:document.getElementById('e_fder').value,conf:document.getElementById('e_conf').value.trim(),chk:{}});
  save(); render();
}
function leerCSV(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const lines=r.result.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length<2){ document.getElementById('impPrev').innerHTML='<p class="err">Archivo sin filas.</p>'; return; }
    const sep=lines[0].includes(';')?';':',';
    const head=lines[0].split(sep).map(h=>h.replace(/"/g,'').trim().toLowerCase());
    const idx=k=>head.indexOf(k.toLowerCase());
    if(idx('codigo')<0){ document.getElementById('impPrev').innerHTML='<p class="err">Falta la columna "codigo".</p>'; return; }
    const filas=lines.slice(1).map(l=>{const c=l.split(sep).map(x=>x.replace(/^"|"$/g,'').trim()); const g=k=>idx(k)>=0?(c[idx(k)]||''):''; return {codigo:g('codigo'),curso:g('curso'),estado:g('estado')||'Activo',nee:g('nee'),fechaEval:g('fechaeval'),fechaReeval:g('fechareeval'),obs:g('obs')};}).filter(x=>x.codigo);
    const existentes=new Set(S.students.map(s=>s.codigo.toLowerCase()));
    const nuevas=filas.filter(x=>!existentes.has(x.codigo.toLowerCase()));
    IMPQ=nuevas;
    document.getElementById('impPrev').innerHTML=`<p>Filas válidas: <b>${filas.length}</b> · Nuevas: <b>${nuevas.length}</b> · Duplicadas (omitidas): <b>${filas.length-nuevas.length}</b></p>
      <button class="btn" onclick="confirmarImport()">Importar ${nuevas.length} estudiante(s)</button>`;
  };
  r.readAsText(f);
}
function confirmarImport(){
  if(!IMPQ||!IMPQ.length) return;
  if(!confirm('Antes de importar se guarda una copia de seguridad local. ¿Continuar?')) return;
  localStorage.setItem(vk()+'_prev',localStorage.getItem(vk()));
  IMPQ.forEach(x=>S.students.push({...x,id:uid(),chk:{}}));
  IMPQ=null; save(); render(); alert('Importación completa.');
}
function cambiarEstado(id){ const s=S.students.find(x=>x.id===id); const o=['Activo','Egresado','Retirado']; s.estado=o[(o.indexOf(s.estado)+1)%o.length]; s.fEst=s.estado==='Activo'?'':hoy(); save(); render(); }
function purgarRetencion(){
  const m=cfg().retMeses||60;
  const lim=addMeses(hoy(),-m);
  S.students.forEach(s=>{ if(s.estado!=='Activo'&&!s.fEst) s.fEst=hoy(); });
  const vencidos=S.students.filter(s=>s.estado!=='Activo'&&s.fEst&&s.fEst<=lim);
  if(!vencidos.length){ save(); alert('No hay estudiantes egresados o retirados que superen el plazo de '+m+' meses.'); render(); return; }
  if(!confirm('Se borrarán definitivamente '+vencidos.length+' estudiante(s) egresado(s) o retirado(s) con más de '+m+' meses, junto con sus atenciones, metas, sesiones, reuniones y casos. Esta acción no se puede deshacer. Se recomienda exportar un respaldo antes. ¿Continuar?')) return;
  const ids=new Set(vencidos.map(s=>s.id));
  S.students=S.students.filter(s=>!ids.has(s.id));
  S.sessions=S.sessions.filter(x=>!ids.has(x.estudiante));
  S.goals=S.goals.filter(x=>!ids.has(x.estudiante));
  S.meetings=S.meetings.filter(x=>!ids.has(x.estudiante));
  S.cases=(S.cases||[]).filter(x=>!ids.has(x.estudiante));
  S.log=S.log||[]; S.log.unshift({f:new Date().toLocaleString('es-CL'),a:'Borrado por retención: '+vencidos.length+' estudiante(s)'});
  save(); render(); alert('Borrado completado: '+vencidos.length+' estudiante(s) eliminados según la política de retención.');
}
function borrar(col,id){ if(!confirm('¿Eliminar este registro? Quedará en la papelera.')) return; S.papelera=S.papelera||[]; const it=S[col].find(x=>x.id===id); if(it) S.papelera.unshift({col,item:it,f:hoy()}); S[col]=S[col].filter(x=>x.id!==id); save(); render(); }
function restaurarPapelera(i){ const p=S.papelera[i]; if(!p) return; S[p.col].push(p.item); S.papelera.splice(i,1); save(); render(); }
function vacearPapelera(){ if(!confirm('¿Vaciar la papelera de forma definitiva?')) return; S.papelera=[]; save(); render(); }
/* ===== atenciones ===== */
let ATORD='fecha';
function ordenAt(a,b){
  if(ATORD==='estudiante') return nombreEst(a.estudiante).localeCompare(nombreEst(b.estudiante))||b.fecha.localeCompare(a.fecha);
  if(ATORD==='prioridad'){ const o={Alta:0,Media:1,Baja:2}; return (o[a.pr||'Media']??1)-(o[b.pr||'Media']??1)||b.fecha.localeCompare(a.fecha); }
  return b.fecha.localeCompare(a.fecha);
}
function chipsAt(){
  const ords=[['fecha','Fecha'],['estudiante','Estudiante'],['prioridad','Prioridad']];
  const o=ords.map(([k,t])=>'<button class="mini" type="button" style="'+(ATORD===k?'background:#1e3a5f;color:#fff':'')+'" onclick="ATORD=\''+k+'\';render()">'+t+'</button>').join('');
  const p=['Alta','Media','Baja'].map(x=>'<button class="mini" type="button" style="'+(FILT.pr===x?'background:#1e3a5f;color:#fff':'')+'" onclick="FILT.pr=FILT.pr===\''+x+'\'?\'\':\''+x+'\';render()">'+x+'</button>').join('');
  return '<p class="meta">Ordenar por</p><div>'+o+'</div><p class="meta">Filtrar por prioridad</p><div>'+p+'</div>';
}
function vAt(){

    const txt=(nombreEst(s.estudiante)+' '+s.tipo+' '+s.desc).toLowerCase();

      <span class="sens">${esc(s.desc)}</span>

    <input placeholder="Buscar por estudiante, tipo o texto" value="${esc(FILT.txt)}" onchange="FILT.txt=this.value.toLowerCase();render()">

  </div>

    <h3>Nueva atención</h3>
    <div class="row"><input type="date" id="a_f" value="${hoy()}"><input type="number" id="a_d" placeholder="Minutos" value="45"></div>
    <div class="row"><input type="time" id="a_hi" title="Hora inicio"><input type="time" id="a_ht" title="Hora término"></div>
    <div class="row">${[30,45,60].map(m=>`<button class="mini" type="button" onclick="document.getElementById('a_d').value=${m}">${m} min</button>`).join('')}</div>

    <select id="a_t">${opts(TIPOS_ATENCION,'')}</select>
    ${recientesHTML()}
    <input placeholder="Escribe el código para buscar estudiante" oninput="filtrarEst(this.value)">

function sensAviso(t){
  const cnt=document.getElementById('descCnt');
  if(cnt){ const n=(t||'').trim().length; cnt.innerHTML=n<10?'<span class="late">'+n+'/10 caracteres mínimos</span>':'<span class="meta">'+n+' caracteres ✔</span>'; }
  const el=document.getElementById('sensWarn'); if(!el) return;
  el.innerHTML=/consumo|droga|alcohol|autolesi|suicid|ideaci|abuso|violencia|golpe/i.test(t||'')?'<span class="late">Atención: el texto parece contener datos sensibles. Regístralos solo si es necesario y en observaciones confidenciales.</span>':'';
}
function calcDur(){
  const i=document.getElementById('a_hi'), t=document.getElementById('a_ht');
  if(!i||!t||!i.value||!t.value) return 0;
  const [h1,m1]=i.value.split(':').map(Number), [h2,m2]=t.value.split(':').map(Number);
  return Math.max(0,(h2*60+m2)-(h1*60+m1));
}
function addAt(){
  const desc=document.getElementById('a_desc').value.trim();
  if((document.getElementById('a_f').value||hoy())>hoy()){ alert('La fecha no puede ser futura.'); return; }
  if(desc.length<10){ alert('La descripción debe tener al menos 10 caracteres.'); return; }
  S.sessions.push({id:uid(),fecha:document.getElementById('a_f').value||hoy(),duracion:calcDur()||document.getElementById('a_d').value||0,tipo:document.getElementById('a_t').value,estudiante:document.getElementById('a_e').value,desc,pr:document.getElementById('a_pr').value,es:document.getElementById('a_es').value,cn:document.getElementById('a_cn').value});
  DRAFT=''; save(); render();
}
function editarAt(id){
  const s=S.sessions.find(x=>x.id===id);
  const d=prompt('Editar descripción:',s.desc); if(d===null) return;
  const f=prompt('Fecha (AAAA-MM-DD):',s.fecha); if(f===null) return;
  s.desc=d.trim(); s.fecha=f.trim()||s.fecha; save(); render();
}

function addGoal(){
  const m=document.getElementById('g_m').value.trim(); if(!m){ alert('Escribe la meta'); return; }

  save(); render();
}
function avanzar(id){ const g=S.goals.find(x=>x.id===id); g.progreso=Math.min(100,g.progreso+10); g.rev=hoy(); g.hist=g.hist||[]; g.hist.push({f:hoy(),p:g.progreso}); save(); render(); }
function setProg(id){
  const g=S.goals.find(x=>x.id===id); const v=prompt('Porcentaje de avance (0-100):',g.progreso); if(v===null) return;
  g.progreso=Math.max(0,Math.min(100,+v||0)); g.rev=hoy(); g.hist=g.hist||[]; g.hist.push({f:hoy(),p:g.progreso}); save(); render();
}

const AVISO_TXT='AVISO DE USO DE LA APLICACIÓN CMI PIE\n\n1. Finalidad: apoyo a la gestión del psicólogo PIE (registro de atenciones, planes de apoyo, seguimiento de casos y plazos normativos).\n2. Datos: se registran preferentemente códigos o iniciales de estudiantes, no nombres completos. Los datos sensibles deben limitarse a lo estrictamente necesario.\n3. Almacenamiento: los datos se guardan cifrados (AES-256) en el equipo del profesional. La aplicación no envía datos a servidores.\n4. Responsable: el profesional que usa la aplicación es responsable del tratamiento de los datos que registra, conforme a la normativa del establecimiento.\n5. Derechos: el titular o su representante puede solicitar acceso, rectificación o supresión de sus datos a través del establecimiento.\n6. Retención: los datos de estudiantes egresados o retirados se eliminan según la política de retención configurada.\n7. Respaldos: los respaldos cifrados deben guardarse en un lugar seguro y su contraseña por separado.\n\nRevisar este texto con la dirección del establecimiento y la normativa vigente (Ley 21.719 de protección de datos personales) antes de usarlo.';
const CONS_TXT='MODELO DE CONSENTIMIENTO INFORMADO (revisar con el establecimiento)\n\nYo, ____________________ (adulto responsable), declaro haber sido informado(a) de que el psicólogo PIE del establecimiento realizará una evaluación psicoeducativa y un plan de apoyo para el estudiante, y que registrará información de seguimiento con fines pedagógicos.\n\nEntiendo que: la información se usará solo para el apoyo del estudiante, se resguardará con confidencialidad y puedo solicitar acceso o corrección de los datos en cualquier momento.\n\nAutorizo / No autorizo (marcar una opción).\n\nFecha: ____________\nNombre y firma del adulto responsable: ____________________\nNombre y firma del profesional: ____________________';
function descTxt(nombre,texto){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([texto],{type:'text/plain;charset=utf-8'})); a.download=nombre; a.click(); }
const NOM_COL={students:'Estudiante',sessions:'Atención',goals:'Meta',meetings:'Reunión',tasks:'Tarea',cases:'Caso',plan:'Bloque'};
function etiq(x){ return String(x.codigo||x.meta||x.motivo||x.desc||x.tema||x.hora||'').slice(0,60); }
async function sha256Hex(str){ const d=await crypto.subtle.digest('SHA-256',enc.encode(str)); return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function exportar(){
  const pw=prompt('Crea una contraseña para este respaldo (mínimo 6 caracteres). Guárdala aparte.');
  if(pw===null) return;
  if(pw.length<6){ alert('La contraseña debe tener al menos 6 caracteres.'); return; }
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const c=await cifrar(await deriveKey(pw,salt),JSON.stringify(S));
  const sha=await sha256Hex(c.ct);
  const meta={est:S.students.length,at:S.sessions.length,met:S.goals.length,fecha:hoy()};
  const out=JSON.stringify({formato:'cmi-pie-respaldo',v:3,salt:b64(salt),iv:c.iv,ct:c.ct,sha,meta});
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([out],{type:'application/json'}));
  a.download='respaldo_cifrado_cmi_pie_'+hoy()+'.json'; a.click();
  cfg().ultimoRespaldo=hoy(); save();
}
function importar(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const obj=JSON.parse(r.result); let nuevo;
      if(obj.formato==='cmi-pie-respaldo'){
        const pw=prompt('Contraseña del respaldo:'); if(pw===null){ input.value=''; return; }
        if(obj.sha){ const h=await sha256Hex(obj.ct); if(h!==obj.sha) throw new Error('integridad'); }
        nuevo=JSON.parse(await descifrar(await deriveKey(pw,unb64(obj.salt)),obj.iv,obj.ct));
        if(obj.meta&&(obj.meta.est!==(nuevo.students||[]).length||obj.meta.at!==(nuevo.sessions||[]).length)) throw new Error('integridad');
      } else if(obj.students){
        if(!confirm('Este respaldo no está cifrado. ¿Continuar?')){ input.value=''; return; }
        nuevo=obj;
      } else throw new Error('formato');
      if(!nuevo||!Array.isArray(nuevo.students)||!Array.isArray(nuevo.sessions)) throw new Error('estructura');
      if(!confirm('Respaldo válido: '+nuevo.students.length+' estudiante(s) y '+nuevo.sessions.length+' atención(es). Esto reemplaza los datos actuales de este perfil. ¿Continuar?')){ input.value=''; return; }
      localStorage.setItem(vk()+'_prev',localStorage.getItem(vk()));
      S={students:[],sessions:[],goals:[],meetings:[],tasks:[],cases:[],plan:[],formacion:0,...nuevo};
      save(); render(); alert('Respaldo importado. Se guardó una copia previa en este equipo.');
    }catch(e){ alert(e.message==='integridad'?'El respaldo está alterado o incompleto (falló la verificación de integridad). No se importó nada.':'No se pudo importar: archivo no válido o contraseña incorrecta.'); }
    input.value='';
  };
  r.readAsText(f);
}

async function exportarPerfil(){
  const pw=prompt('Contraseña para transferir este perfil (mínimo 6 caracteres). Se pedirá al importarlo.');
  if(pw===null) return; if(pw.length<6){ alert('La contraseña debe tener al menos 6 caracteres.'); return; }
  const pf=perfilActual(); const salt=crypto.getRandomValues(new Uint8Array(16));
  const c=await cifrar(await deriveKey(pw,salt),JSON.stringify(S));
  const out=JSON.stringify({formato:'cmi-pie-perfil',v:1,meta:{nombre:pf.nombre,cargo:pf.cargo||'',establecimiento:pf.establecimiento||'',anio:pf.anio||''},salt:b64(salt),iv:c.iv,ct:c.ct});
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([out],{type:'application/json'})); a.download='perfil_cmi_pie_'+hoy()+'.json'; a.click();
  alert('Paso 1 de 3 completado: perfil exportado.\n\nEl perfil de origen NO se borró. Guarda el archivo y su contraseña antes de importarlo en otro equipo.');
}
function importarPerfil(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    try{
      const obj=JSON.parse(await f.text()); if(obj.formato!=='cmi-pie-perfil') throw new Error('formato');
      const pw=prompt('Contraseña que usaste al transferir el perfil:'); if(pw===null) return;
      const datos=JSON.parse(await descifrar(await deriveKey(pw,unb64(obj.salt)),obj.iv,obj.ct));
      if(!confirm('Paso 2 de 3 (verificación): archivo válido. Perfil: '+obj.meta.nombre+' · '+(datos.students||[]).length+' estudiante(s), '+(datos.sessions||[]).length+' atención(es), '+(datos.goals||[]).length+' meta(s). ¿Continuar con la importación?')) return;
      const p1=prompt('Nuevo PIN para este perfil en este equipo (6 a 12 números):'); if(p1===null) return;
      if(!pinValido(p1)){ alert('El PIN debe tener entre 6 y 12 números.'); return; }
      if(prompt('Repite el nuevo PIN:')!==p1){ alert('Los PIN no coinciden.'); return; }
      const id=uid(), salt2=crypto.getRandomValues(new Uint8Array(16));
      SALT=b64(salt2); CK=await deriveKey(p1,salt2);
      S=datos; S.cfg=S.cfg||{nivel:'estandar',plazoMeses:PLAZO_DEFAULT_MESES};
      const lista=getPerfiles();
      lista.push({id,nombre:obj.meta.nombre,cargo:obj.meta.cargo,establecimiento:obj.meta.establecimiento,anio:obj.meta.anio,vk:'cmi_pie_vault_'+id,fallos:0,bloqueadoHasta:0});
      setPerfiles(lista); PID=id; await guardar();
      alert('Paso 3 de 3 completado: perfil importado. Ingresa con tu nuevo PIN. El perfil original en el otro equipo no fue modificado.'); showLock();
    }catch(e){ alert('No se pudo importar el perfil: archivo o contraseña no válidos.'); }
  };
  inp.click();
}

  const s=S.students.find(x=>x.id===sid); s.informales=s.informales||[]; s.informales.push({f:hoy(),t}); save(); render();
}
/* ===== informes ===== */
function infEst(sid){ FICHA=sid; cur='infest'; history.pushState({v:'infest'},''); render(); window.scrollTo(0,0); }
function vInfEst(){
  const s=S.students.find(x=>x.id===FICHA); if(!s){ go('estudiantes'); return ''; }
  const at=S.sessions.filter(x=>x.estudiante===s.id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const gs=S.goals.filter(g=>g.estudiante===s.id);
  const ses=(s.ses||[]).slice().sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const dom=DOMINIOS.map((d,i)=>{const p=(s.perfil||{})[i]||{}; return `<p class="meta">${esc(d)}: dificultad ${esc(p.d||NIV_DIF[0])} · apoyo ${esc(p.a||NIV_APO[0])}</p>`;}).join('');
  return `
  <button class="btn sec noprint" onclick="go('estudiantes')">← Volver</button>
  <button class="btn noprint" onclick="window.print()">Imprimir / guardar PDF</button>
  <div class="card">
    <h2>Informe del estudiante ${esc(s.codigo)}</h2>
    <p class="meta">Generado ${hoy()}. Solo código, sin observaciones confidenciales.</p>
    <h3>Identificación</h3>
    <p>Curso: ${esc(s.curso||'—')} · Estado: ${esc(s.estado)} · NEE: ${esc(s.nee||'—')}</p>
    <h3>Evaluación PIE</h3>
    <p class="meta">Evaluación: ${esc(s.fechaEval||'—')} · Profesional: ${esc(s.prof||'—')} · Instrumentos: ${esc(s.inst||'—')}</p>
    <p class="meta">Elegibilidad: ${esc(s.elig||'—')} · Vigencia hasta: ${esc(vencimientoEval(s)||'—')}</p>
    ${s.evalDet?`<p class="meta">Tipo: ${esc(s.evalDet.tipo)} · Informe: ${esc(s.evalDet.finf||'—')}</p><p>${esc(s.evalDet.hall||'')}</p><p class="meta">Justificación: ${esc(s.evalDet.just||'—')}</p>`:''}
    <h3>Checklist normativo</h3>
    <p class="meta">Evaluación: ${c(s,'eval')} · Informe: ${c(s,'inf')} · Consentimiento: ${c(s,'cons')} · Reunión: ${c(s,'reun')}</p>
    <h3>Perfil de funcionamiento</h3>${dom}
    <h3>Metas</h3>${gs.map(g=>`<p>${esc(g.meta)} · ${g.progreso}% (línea base ${esc(g.linea||'—')} → ${esc(g.final||'—')})</p>`).join('')||'<p class="empty">Sin metas.</p>'}
    <h3>Planificación de sesiones</h3>${ses.map(x=>`<p class="meta">${esc(x.fecha)} · ${esc(x.obj||'—')} · ${x.ok?'Realizada':'Planificada'}</p>`).join('')||'<p class="empty">Sin sesiones.</p>'}
    <h3>Atenciones (${at.length})</h3>${at.map(a=>`<p class="meta">${esc(a.fecha)} · ${esc(a.tipo)} · ${esc(a.duracion)} min</p>`).join('')||'<p class="empty">Sin atenciones.</p>'}
  </div>`;
}
function c(s,k){ return (s.chk||{})[k]?'Sí':'No'; }
/* ===== informe del período ===== */
function vInf(){
  const en=s=>(!FD||s.fecha>=FD)&&(!FH||s.fecha<=FH);
  const ses=S.sessions.filter(en);
  const porTipo={}; ses.forEach(s=>porTipo[s.tipo]=(porTipo[s.tipo]||0)+1);
  const porNee={}; S.students.forEach(s=>porNee[s.nee||'Sin NEE']=(porNee[s.nee||'Sin NEE']||0)+1);
  const porMes={}; ses.forEach(s=>{const m=s.fecha.slice(0,7); porMes[m]=(porMes[m]||0)+1;});
  const mx=Math.max(1,...Object.values(porMes));
  const barra=(obj,mxv)=>Object.entries(obj).sort().map(([k,v])=>`<div class="item"><span class="meta">${esc(k)}</span><div class="bar"><div style="width:${v/mxv*100}%"></div></div><span class="meta">${v}</span></div>`).join('')||'<p class="empty">Sin datos.</p>';
  const mxT=Math.max(1,...Object.values(porTipo));
  const log=(S.log||[]).slice(0,20).map(l=>`<p class="meta">${esc(l.f)} · ${esc(l.a)}</p>`).join('')||'<p class="empty">Sin accesos registrados.</p>';
  return `
  <h2>Informes y exportación</h2>
  <p class="meta noprint">PDF: usa "Imprimir / guardar como PDF" y elige Guardar como PDF en el diálogo del navegador. Excel: el archivo .xls abre en Excel con 4 hojas (Estudiantes, Atenciones, Metas, Reuniones).</p>
  <div class="card"><h3>Filtro de fechas</h3>
    <div class="row"><div><small class="meta">Desde</small><input type="date" value="${FD}" onchange="FD=this.value;render()"></div><div><small class="meta">Hasta</small><input type="date" value="${FH}" onchange="FH=this.value;render()"></div></div>
    <button class="mini" onclick="FD='';FH='';render()">Quitar filtro</button>
    <p class="meta">Atenciones en el período: ${ses.length}</p></div>
  <div class="card"><h3>Atenciones por tipo</h3>${barra(porTipo,mxT)}</div>
  <div class="card"><h3>Distribución por NEE</h3>${barra(porNee,Math.max(1,...Object.values(porNee)))}</div>
  <div class="card"><h3>Tendencia mensual</h3>${barra(porMes,mx)}</div>
  <div class="card">
    <h3>Exportar</h3>
    <p class="meta">Los CSV contienen datos personales. Guárdalos en un lugar seguro.</p>
    <button class="btn" onclick="if(confirm('Se descargarán CSV con datos sensibles. ¿Continuar?'))exportarCSV()">Exportar a CSV (abre en Excel)</button>
    <button class="btn" onclick="exportarExcel()">Exportar a Excel (.xls, 4 hojas)</button>
    <button class="btn" onclick="exportarICS()">Exportar calendario (.ics) para Google Calendar</button>
    <button class="btn sec" onclick="window.print()">Imprimir / guardar como PDF</button></div>
  <div class="card"><h3>Recursos de referencia</h3><p class="meta">Consulta la normativa vigente: Decreto 170/2009 y especial.mineduc.cl.</p></div>
  <div class="card"><h3>Registro de accesos</h3>${log}</div>`;
}
function csvDe(filas){ return filas.map(f=>f.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n'); }
function descargar(nombre,texto){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+texto],{type:'text/csv'})); a.download=nombre; a.click(); }
function exportarCSV(){
  const est=[['Codigo','Curso','Estado','NEE','Fecha evaluacion','Reevaluacion','Profesional','Instrumentos','Elegibilidad','Derivacion','Fecha derivacion']].concat(S.students.map(s=>[s.codigo,s.curso,s.estado,s.nee,s.fechaEval,s.fechaReeval,s.prof,s.inst,s.elig,s.der,s.fder]));
  descargar('estudiantes_'+hoy()+'.csv',csvDe(est));
  const at=[['Fecha','Estudiante','Tipo','Minutos','Descripcion']].concat(S.sessions.map(s=>[s.fecha,nombreEst(s.estudiante),s.tipo,s.duracion,s.desc]));
  descargar('atenciones_'+hoy()+'.csv',csvDe(at));
}
/* Exportación a Excel (SpreadsheetML, abre en Excel como .xls) */
function exportarExcel(){
  if(!confirm('Se descargará un Excel con datos personales (códigos y atenciones). ¿Continuar?')) return;
  const x=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const celda=v=>typeof v==='number'?'<Cell><Data ss:Type="Number">'+v+'</Data></Cell>':'<Cell><Data ss:Type="String">'+x(v)+'</Data></Cell>';
  const hoja=(nombre,filas)=>'<Worksheet ss:Name="'+x(nombre)+'"><Table>'+filas.map(f=>'<Row>'+f.map(celda).join('')+'</Row>').join('')+'</Table></Worksheet>';
  const en=s=>(!FD||s.fecha>=FD)&&(!FH||s.fecha<=FH);
  const hojas=[
    hoja('Estudiantes',[['Codigo','Curso','Estado','NEE','Fecha evaluacion','Reevaluacion','Profesional','Instrumentos','Elegibilidad','Derivacion','Fecha derivacion']].concat(S.students.map(s=>[s.codigo,s.curso,s.estado,s.nee,s.fechaEval,s.fechaReeval,s.prof,s.inst,s.elig,s.der,s.fder]))),
    hoja('Atenciones',[['Fecha','Estudiante','Tipo','Minutos','Prioridad','Estado','Canal','Descripcion']].concat(S.sessions.filter(en).map(s=>[s.fecha,nombreEst(s.estudiante),s.tipo,+s.duracion||0,s.pr||'',s.es||'',s.cn||'',s.desc]))),
    hoja('Metas',[['Estudiante','Meta','Area','Responsable','Linea base','Meta final','Plazo','Avance %']].concat(S.goals.map(g=>[nombreEst(g.estudiante),g.meta,g.area||'',g.resp||'',g.linea||'',g.final||'',g.plazo||'',+g.progreso||0]))),
    hoja('Reuniones',[['Fecha','Estudiante','Estado','Participantes','Tema']].concat(S.meetings.map(r=>[r.fecha,nombreEst(r.estudiante),r.estado,r.participantes||'',r.tema||''])))
  ].join('');
  const libro='<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+hojas+'</Workbook>';
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([libro],{type:'application/vnd.ms-excel'})); a.download='cmi_pie_datos_'+hoy()+'.xls'; a.click();
}
function icsEsc(s){ return String(s??'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function icsEvento(id,fecha,titulo,desc){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  return ['BEGIN:VEVENT','UID:'+id+'@cmi-pie','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+fecha.replace(/-/g,''),'SUMMARY:'+icsEsc(titulo),'DESCRIPTION:'+icsEsc(desc),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Recordatorio CMI PIE','TRIGGER:-P1D','END:VALARM','END:VEVENT'];
}
function exportarICS(){
  if(!confirm('Se descargará un calendario con códigos de estudiantes y fechas. ¿Continuar?')) return;
  const ev=[];
  S.students.filter(s=>s.fechaReeval).forEach(s=>ev.push(...icsEvento('reev-'+s.id,s.fechaReeval,'Reevaluación PIE: '+s.codigo,'Revisar evaluación vigente según normativa.')));
  S.meetings.filter(r=>r.estado==='Programada'&&r.fecha).forEach(r=>ev.push(...icsEvento('reun-'+r.id,r.fecha,'Reunión: '+nombreEst(r.estudiante),(r.participantes||'')+' · '+(r.tema||''))));
  S.tasks.filter(t=>!t.done&&t.vence).forEach(t=>ev.push(...icsEvento('tar-'+t.id,t.vence,'Tarea: '+t.desc,t.tipo)));
  S.goals.filter(g=>g.plazo&&g.progreso<100).forEach(g=>ev.push(...icsEvento('meta-'+g.id,g.plazo,'Plazo de meta: '+nombreEst(g.estudiante),g.meta)));
  if(!ev.length){ alert('No hay fechas para exportar.'); return; }
  const cal=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CMI PIE//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH',...ev,'END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([cal],{type:'text/calendar;charset=utf-8'})); a.download='cmi_pie_calendario_'+hoy()+'.ics'; a.click();
}
/* ===== casos ===== */
function vCasos(){
  S.cases=S.cases||[];
  const lista=[...S.cases].sort((a,b)=>(a.estado==='Cerrado')-(b.estado==='Cerrado')||(b.inicio||'').localeCompare(a.inicio||'')).map(c=>`
    <div class="item"><b>${esc(c.motivo)}</b> <span class="tag ${c.riesgo?'warn':''}">${c.riesgo?'Riesgo':'Seguimiento'}</span><span class="tag">${esc(c.estado)}</span><br>
      <span class="meta">${esc(nombreEst(c.estudiante))} · Inicio ${esc(c.inicio)} · Revisión ${esc(c.revision||'—')} · ${esc(c.responsable||'')}</span>
      <div class="sens" style="margin-top:4px">${(c.linea||[]).map(l=>`<p class="meta">• ${esc(l.f)}: ${esc(l.t)}</p>`).join('')}</div>
      <div style="margin-top:4px"><button class="mini" onclick="avanzarCaso('${c.id}')">Avanzar estado</button><button class="mini" onclick="notaCaso('${c.id}')">+ Nota</button><button class="del" onclick="borrar('cases','${c.id}')">Eliminar</button></div></div>`).join('')||'<p class="empty">Sin casos registrados.</p>';
  return `
  <h2>Seguimiento de casos</h2>
  <div class="card" style="border-left:4px solid #dc2626"><h3>Protocolo ante riesgo (guía de apoyo)</h3>
    <p class="meta">Esta guía no reemplaza los protocolos de tu establecimiento.</p>
    <p style="font-size:14px">1. No dejes solo al estudiante.<br>2. Informa de inmediato a dirección o convivencia escolar.<br>3. Si hay riesgo vital: SAMU 131 o Carabineros 133.<br>4. Registra la situación y los pasos en el caso.<br>5. Coordina derivación y revisión en 24 a 48 horas.</p>
    <p style="font-size:14px"><b>Emergencias:</b> SAMU 131 · Carabineros 133 · Bomberos 132 · Fono Ayuda Infantil 102</p></div>
  <div class="card"><h3>Nuevo caso</h3>
    <select id="c_e">${S.students.map(s=>`<option value="${s.id}">${esc(s.codigo)}</option>`).join('')}</select>
    <input id="c_m" placeholder="Motivo (ej: conducta en aula, bajo rendimiento)">
    <div class="row"><input type="date" id="c_i" value="${hoy()}"><input type="date" id="c_r" title="Próxima revisión"></div>
    <input id="c_resp" placeholder="Responsable (ej: psicólogo PIE, UTP)">
    <select id="c_rg"><option value="">Seguimiento</option><option value="1">Riesgo</option></select>
    <button class="btn" onclick="addCaso()">Guardar caso</button></div>
  <div class="card">${lista}</div>`;
}
function addCaso(){
  const m=document.getElementById('c_m').value.trim(); if(!m){ alert('Escribe el motivo'); return; }
  const ini=document.getElementById('c_i').value||hoy(), rev=document.getElementById('c_r').value;
  if(ini>hoy()){ alert('La fecha de inicio no puede ser futura.'); return; }
  if(rev&&rev<ini){ alert('La próxima revisión no puede ser anterior al inicio del caso.'); return; }
  if(rev&&rev<hoy()&&!confirm('La fecha de próxima revisión ya pasó. ¿Guardar igualmente?')) return;
  S.cases=S.cases||[];
  S.cases.push({id:uid(),estudiante:document.getElementById('c_e').value,motivo:m,inicio:document.getElementById('c_i').value||hoy(),revision:document.getElementById('c_r').value,responsable:document.getElementById('c_resp').value.trim(),riesgo:!!document.getElementById('c_rg').value,estado:'Abierto',linea:[{f:hoy(),t:'Caso abierto'}]});
  save(); render();
}
function avanzarCaso(id){ const c=S.cases.find(x=>x.id===id); const sig=ESTADOS_CASO[(ESTADOS_CASO.indexOf(c.estado)+1)%ESTADOS_CASO.length]; if(sig==='Cerrado'&&!confirm('¿Cerrar este caso? Quedará en la lista de cerrados.')) return; c.estado=ESTADOS_CASO[(ESTADOS_CASO.indexOf(c.estado)+1)%ESTADOS_CASO.length]; c.linea=c.linea||[]; c.linea.push({f:hoy(),t:'Estado: '+c.estado}); save(); render(); }
function notaCaso(id){ const c=S.cases.find(x=>x.id===id); const t=prompt("Nota del caso. Para una derivación escribe 'Derivación: a quién, motivo'."); if(!t) return; c.linea=c.linea||[]; c.linea.push({f:hoy(),t:t.trim()}); save(); render(); }
/* ===== planificador semanal ===== */
function vPlanif(){
  S.plan=S.plan||[];
  const dias=['Lunes','Martes','Miércoles','Jueves','Viernes'];
  const tot=S.plan.reduce((a,p)=>a+(+p.min||0),0);
  const dir=S.plan.filter(p=>p.tipo==='Atención directa').reduce((a,p)=>a+(+p.min||0),0);
  const pct=tot?Math.round(dir/tot*100):0;
  const lista=dias.map(d=>{const bl=S.plan.filter(p=>p.dia===d).sort((a,b)=>a.hora.localeCompare(b.hora)); return `<div class="item"><b>${d}</b>${bl.map(p=>`<div class="meta">${esc(p.hora)} · ${esc(p.tipo)} · ${esc(p.min)} min${p.nota?' · '+esc(p.nota):''} <button class="del" onclick="borrar('plan','${p.id}')">×</button></div>`).join('')||'<div class="meta">Sin bloques</div>'}</div>`;}).join('');
  return `<h2>Planificación semanal</h2>
  <div class="card"><h3>Jornada</h3><p>Atención directa: <b>${pct}%</b> del tiempo planificado (${tot} min)</p><div class="bar"><div style="width:${pct}%"></div></div></div>
  <div class="card"><h3>Nuevo bloque</h3>
    <div class="row"><select id="pl_d">${opts(dias,'')}</select><input type="time" id="pl_h"></div>
    <div class="row"><select id="pl_t">${opts(['Atención directa','Atención indirecta','Coordinación','Administrativa','Formación','Reunión institucional','Consejo de profesores'],'')}</select><input type="number" id="pl_m" value="45" placeholder="Minutos"></div>
    <input id="pl_n" placeholder="Nota (opcional)">
    <button class="btn" onclick="addPlan()">Agregar bloque</button></div>
  <div class="card">${lista}</div>`;
}
function addPlan(){
  const h=document.getElementById('pl_h').value; if(!h){ alert('Indica la hora'); return; }
  const dia0=document.getElementById('pl_d').value, tipo0=document.getElementById('pl_t').value;
  const choque=(S.plan||[]).find(p=>p.dia===dia0&&p.hora===h);
  if(choque&&!confirm('Ya hay un bloque ('+choque.tipo+') a esa hora el '+dia0+'. ¿Agregar de todas formas?')) return;
  if(tipo0==='Atención directa'&&(S.plan||[]).some(p=>p.dia===dia0&&(p.tipo==='Reunión institucional'||p.tipo==='Consejo de profesores')&&p.hora===h)){ alert('Hay una reunión o consejo a esa hora: no se puede bloquear atención directa encima.'); return; }
  S.plan=S.plan||[];
  S.plan.push({id:uid(),dia:document.getElementById('pl_d').value,hora:h,tipo:document.getElementById('pl_t').value,min:+document.getElementById('pl_m').value||0,nota:document.getElementById('pl_n').value.trim()});
  save(); render();
}
function bindSwipe(){
  document.querySelectorAll('[data-sw],[data-del]').forEach(el=>{
    let x0=null;
    el.addEventListener('pointerdown',e=>{ x0=e.clientX; });
    el.addEventListener('pointerup',e=>{
      if(x0===null) return; const dx=e.clientX-x0; x0=null;
      if(el.dataset.sw && dx>80) toggleTarea(el.dataset.sw);
      else if(el.dataset.del && dx<-80){ const [col,id]=el.dataset.del.split(':'); borrar(col,id); }
    });
  });
}
document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('priv',document.hidden&&!!S);});
boot();
</script>
