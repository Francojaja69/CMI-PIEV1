<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e3a5f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>CMI PIE - Franco Espinoza Aparicio</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#eef2f7;color:#1e293b;padding-bottom:84px}
header{background:linear-gradient(135deg,#1e3a5f 0%,#0b1d33 100%);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:5;box-shadow:0 4px 14px rgba(11,29,51,.25);border-bottom:2px solid #c9a227}
header h1{font-size:17px;margin:0}
header small{opacity:.85;font-size:12px}
main{padding:12px}
nav{position:fixed;bottom:8px;left:8px;right:8px;display:flex;background:rgba(255,255,255,.96);border-radius:18px;box-shadow:0 8px 24px rgba(15,23,42,.18);z-index:5;padding:4px}
nav:empty{display:none}
nav button{flex:1;padding:9px 0;border:0;background:none;font-size:11px;color:#475569}
nav button.act{color:#fff;font-weight:bold;background:linear-gradient(135deg,#1e3a5f,#2d5a8c);border-radius:12px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(15,23,42,.06);border:1px solid #e2e8f0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:16px;padding:14px 10px;text-align:center;box-shadow:0 2px 8px rgba(15,23,42,.06);border-top:4px solid #c9a227}
.kpi b{font-size:22px;color:#1e3a5f;display:block}
.kpi span{font-size:12px;color:#64748b}
h2{font-size:18px;margin:4px 0 10px}
h3{font-size:15px;margin:4px 0 8px;color:#1e3a5f}
input,select,textarea{width:100%;padding:11px;margin:3px 0 10px;border:1px solid #cbd5e1;border-radius:12px;font-size:15px;background:#f8fafc;color:#1e293b}
input:focus,select:focus,textarea:focus{outline:none;border-color:#2d5a8c;background:#fff;box-shadow:0 0 0 3px rgba(45,90,140,.15)}
button.btn{background:linear-gradient(135deg,#1e3a5f,#2d5a8c);color:#fff;border:0;padding:12px 14px;border-radius:12px;font-size:15px;font-weight:600;width:100%;margin-top:6px;box-shadow:0 3px 8px rgba(30,58,95,.3)}
button.sec{background:#e2e8f0;color:#1e293b;box-shadow:none}
button.mini{background:#e2e8f0;border:0;padding:4px 8px;border-radius:6px;font-size:12px;margin-left:4px}
button.del{background:#fee2e2;color:#b91c1c;border:0;padding:4px 8px;border-radius:6px;font-size:12px;margin-left:4px}
.item{border-bottom:1px solid #e2e8f0;padding:9px 0;font-size:14px}
.item:last-child{border-bottom:0}
.meta{font-size:12px;color:#64748b}
.tag{display:inline-block;background:#e0f2fe;color:#075985;border-radius:999px;padding:2px 9px;font-size:11px;margin-right:4px;font-weight:600}
.tag.warn{background:#fef3c7;color:#92400e}
.tag.ok{background:#dcfce7;color:#166534}
.bar{background:#e2e8f0;border-radius:999px;height:10px;overflow:hidden;margin:6px 0}
.bar div{background:linear-gradient(90deg,#c9a227,#16a34a);height:100%;border-radius:999px;transition:width .4s}
.persp{border-left:4px solid #1e3a5f;padding-left:10px;margin-bottom:12px}
.persp p{margin:4px 0;font-size:14px}
.late{color:#dc2626;font-weight:bold}
.empty{color:#94a3b8;font-size:14px;text-align:center;padding:10px}
.err{color:#b91c1c;font-size:14px;min-height:18px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.pres .sens{filter:blur(6px);user-select:none}
</style>
</head>
<body>
<header>
  <h1>CMI Psicólogo PIE</h1>
  <small>Franco Espinoza Aparicio</small>
</header>

<main id="app"></main>
<nav id="nav"></nav>

<script>
const VKEY = 'cmi_pie_franco_vault_v2';
const TIPOS_NEE = ['TEA','TDAH','Discapacidad Intelectual','Trastorno Específico del Lenguaje (TEL)','Discapacidad Auditiva','Discapacidad Visual','Disfasia','Funcionamiento Intelectual Limítrofe','Dificultades Específicas del Aprendizaje (DEA)','Trastorno de Déficit Atencional','Otra'];
const TIPOS_ATENCION = ['Intervención individual','Intervención grupal','Evaluación psicoeducativa','Entrevista familia','Coordinación docente','Observación de aula','Capacitación / Formación','Otra'];
const MIN_INACTIVO = 5*60*1000;

const enc = new TextEncoder();
const dec = new TextDecoder();

let S = null;      // datos en memoria (solo con la app desbloqueada)
let CK = null;     // clave AES derivada del PIN (solo en memoria)
let SALT = null;   // sala de derivación guardada en base64
let cur = 'inicio';
let timer = null;

/* ================= CRIPTOGRAFÍA ================= */
function b64(buf){
  const bytes = new Uint8Array(buf); let s='';
  for(let i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]);
  return btoa(s);
}
function unb64(str){ return Uint8Array.from(atob(str), c=>c.charCodeAt(0)); }

async function deriveKey(pin, salt){
  const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}
async function cifrar(clave, texto){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, clave, enc.encode(texto));
  return {iv:b64(iv), ct:b64(ct)};
}
async function descifrar(clave, ivB64, ctB64){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(ivB64)}, clave, unb64(ctB64));
  return dec.decode(pt);
}
function pinValido(p){ return /^\d{6,12}$/.test(p); }

async function guardar(){
  const c = await cifrar(CK, JSON.stringify(S));
  localStorage.setItem(VKEY, JSON.stringify({v:2, salt:SALT, iv:c.iv, ct:c.ct}));
}
function save(){ guardar().catch(()=>alert('No se pudo guardar de forma cifrada.')); }

/* ================= ACCESO, PIN Y BLOQUEO ================= */
function boot(){
  if(localStorage.getItem(VKEY)) showLock(); else showSetup();
}
function renderNav(on){
  const nav = document.getElementById('nav');
  nav.innerHTML = on ? Object.keys(vistas).map(k=>
    `<button class="${k===cur?'act':''}" onclick="go('${k}')">${vistas[k].i}<br>${vistas[k].t}</button>`).join('') : '';
}
function showSetup(){
  S=null; CK=null; renderNav(false);
  document.getElementById('app').innerHTML = `
  <div class="card">
    <h2>Crear PIN</h2>
    <p class="meta">El PIN abre la app y cifra tus datos en este equipo. Si lo olvidas, los datos no se pueden recuperar, por eso conviene hacer respaldos cifrados.</p>
    <input id="pin1" type="password" inputmode="numeric" maxlength="12" placeholder="PIN (6 a 12 números)">
    <input id="pin2" type="password" inputmode="numeric" maxlength="12" placeholder="Repite el PIN">
    <p class="err" id="pinErr"></p>
    <button class="btn" onclick="crearPin()">Crear PIN y comenzar</button>
  </div>`;
}
async function crearPin(){
  const p1 = document.getElementById('pin1').value;
  const p2 = document.getElementById('pin2').value;
  const err = document.getElementById('pinErr');
  if(!pinValido(p1)){ err.textContent='El PIN debe tener entre 6 y 12 números.'; return; }
  if(p1!==p2){ err.textContent='Los PIN no coinciden.'; return; }
  const salt = crypto.getRandomValues(new Uint8Array(16));
  SALT = b64(salt);
  CK = await deriveKey(p1, salt);
  S = {students:[],sessions:[],goals:[],meetings:[],tasks:[],formacion:0};
  await guardar();
  iniciarSesion();
}
function showLock(){
  S=null; CK=null; clearTimeout(timer); renderNav(false);
  document.getElementById('app').innerHTML = `
  <div class="card">
    <h2>App bloqueada</h2>
    <p class="meta">Ingresa tu PIN para continuar.</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="12" placeholder="PIN" onkeydown="if(event.key==='Enter')desbloquear()">
    <button class="btn" onclick="desbloquear()">Desbloquear</button>
    <p class="err" id="pinErr"></p>
  </div>`;
}
async function desbloquear(){
  const pin = document.getElementById('pin').value;
  const err = document.getElementById('pinErr');
  if(!pinValido(pin)){ err.textContent='El PIN debe tener entre 6 y 12 números.'; return; }
  try{
    const v = JSON.parse(localStorage.getItem(VKEY));
    const clave = await deriveKey(pin, unb64(v.salt));
    const texto = await descifrar(clave, v.iv, v.ct);
    S = JSON.parse(texto);
    CK = clave; SALT = v.salt;
    iniciarSesion();
  }catch(e){
    err.textContent='PIN incorrecto.';
  }
}
function iniciarSesion(){
  registrar('Acceso a la app'); cur='inicio'; render(); resetTimer();
}
function bloquear(){ showLock(); }
function resetTimer(){
  clearTimeout(timer);
  if(CK) timer = setTimeout(bloquear, MIN_INACTIVO);
}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, resetTimer));

async function cambiarPin(){
  if(!CK) return;
  const p1 = prompt('Nuevo PIN (6 a 12 números):');
  if(p1===null) return;
  if(!pinValido(p1)){ alert('El PIN debe tener entre 6 y 12 números.'); return; }
  const p2 = prompt('Repite el nuevo PIN:');
  if(p1!==p2){ alert('Los PIN no coinciden.'); return; }
  const salt = crypto.getRandomValues(new Uint8Array(16));
  SALT = b64(salt);
  CK = await deriveKey(p1, salt);
  await guardar();
  alert('PIN cambiado correctamente.');
}

/* ================= NAVEGACIÓN Y CMI ================= */
let _dummy = null;
function load(){ return S; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hoy(){ return new Date().toISOString().slice(0,10); }
function mesActual(){ return hoy().slice(0,7); }
function diasDesde(f){ return Math.floor((new Date(hoy()) - new Date(f))/86400000); }
function nombreEst(id){ const e=S.students.find(x=>x.id===id); return e? e.codigo : '—'; }
function opts(arr, sel){ return arr.map(o=>`<option ${o===sel?'selected':''}>${esc(o)}</option>`).join(''); }
function studentOpts(sel){ return S.students.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.codigo)} - ${esc(s.nee)}</option>`).join(''); }

const vistas = {
  inicio:{t:'Inicio',i:'📊'},
  estudiantes:{t:'Estudiantes',i:'👦'},
  atenciones:{t:'Atenciones',i:'📝'},
  planes:{t:'Planes',i:'🎯'},
  familias:{t:'Familias',i:'👪'},
  tareas:{t:'Tareas',i:'✅'},
  casos:{t:'Casos',i:'🧭'},
  informes:{t:'Informes',i:'📄'},
  respaldo:{t:'Respaldo',i:'💾'}
};

function render(){
  if(!S) return;
  renderNav(true);
  const fn = {inicio:vInicio,estudiantes:vEst,atenciones:vAt,planes:vPlanes,familias:vFam,tareas:vTar,respaldo:vRes,ficha:vFicha,casos:vCasos,informes:vInf}[cur];
  document.getElementById('app').innerHTML = fn();
}
function go(v){ cur=v; render(); window.scrollTo(0,0); resetTimer(); }

function vInicio(){
  const activos = S.students.filter(s=>s.estado==='Activo');
  const atMes = S.sessions.filter(s=>s.fecha.startsWith(mesActual()));
  const conNotas = S.sessions.filter(s=>s.desc && s.desc.trim().length>10).length;
  const pctNotas = S.sessions.length? Math.round(conNotas/S.sessions.length*100):0;
  const metas = S.goals;
  const avgMetas = metas.length? Math.round(metas.reduce((a,g)=>a+g.progreso,0)/metas.length):0;
  const metasLogradas = metas.filter(g=>g.progreso>=100).length;
  const reun = S.meetings;
  const reunRealizadas = reun.filter(r=>r.estado==='Realizada').length;
  const pctReun = reun.length? Math.round(reunRealizadas/reun.length*100):0;
  const tareas = S.tasks;
  const tHechas = tareas.filter(t=>t.done).length;
  const pctTareas = tareas.length? Math.round(tHechas/tareas.length*100):0;
  const sinAtencion = activos.filter(s=>{
    const u = S.sessions.filter(x=>x.estudiante===s.id).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
    return !u || diasDesde(u.fecha)>30;
  });
  const formacion = S.sessions.filter(s=>s.tipo==='Capacitación / Formación').reduce((a,s)=>a+(+s.duracion||0),0)/60;
  const vencidas = S.tasks.filter(t=>!t.done && t.vence && t.vence<hoy()).length;

  const lim30 = new Date(Date.now()+30*86400000).toISOString().slice(0,10);
  const reevalProx = activos.filter(s=>s.fechaReeval && s.fechaReeval>=hoy() && s.fechaReeval<=lim30);
  const metasVenc = S.goals.filter(g=>g.plazo && g.plazo<hoy() && g.progreso<100).length;
  const reunPend = S.meetings.filter(r=>r.estado==='Programada' && r.fecha>=hoy()).length;
  const alertas = [];
  if(vencidas) alertas.push(`${vencidas} tarea(s) vencida(s)`);
  if(reevalProx.length) alertas.push(`${reevalProx.length} reevaluación(es) en los próximos 30 días`);
  if(metasVenc) alertas.push(`${metasVenc} meta(s) con plazo vencido`);
  if(sinAtencion.length) alertas.push(`${sinAtencion.length} estudiante(s) sin atención hace más de 30 días`);
  if(reunPend) alertas.push(`${reunPend} reunión(es) programada(s)`);
  const casosRiesgo=(S.cases||[]).filter(c=>c.riesgo&&c.estado!=='Cerrado').length;
  if(casosRiesgo) alertas.push(`${casosRiesgo} caso(s) de riesgo abiertos`);
  const h = new Date().getHours();
  const saludo = h<12?'Buenos días':h<20?'Buenas tardes':'Buenas noches';
  const fechaTxt = new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});
  return `
  <div class="card" style="background:linear-gradient(135deg,#1e3a5f,#2d5a8c);color:#fff;border:0">
    <div style="font-size:13px;opacity:.85">${saludo}</div>
    <div style="font-size:19px;font-weight:700">Hola, Franco</div>
    <div style="font-size:13px;margin-top:4px;opacity:.9;text-transform:capitalize">${fechaTxt}</div>
  </div>
  <div class="card" style="border-left:4px solid #c9a227">
    <h3>Alertas del día</h3>
    ${alertas.length? alertas.map(a=>`<p style="margin:5px 0;font-size:14px">• ${esc(a)}</p>`).join('') : '<p class="empty">Sin alertas pendientes ✔</p>'}
  </div>
  <div class="kpis">
    <div class="kpi"><b>${activos.length}</b><span>Estudiantes PIE activos</span></div>
    <div class="kpi"><b>${atMes.length}</b><span>Atenciones este mes</span></div>
    <div class="kpi"><b>${avgMetas}%</b><span>Avance promedio de metas</span></div>
    <div class="kpi"><b>${vencidas}</b><span>Tareas vencidas</span></div>
  </div>

  <h2>Cuadro de Mando Integral</h2>

  <div class="card persp">
    <h3>1. Perspectiva Estudiantes (impacto)</h3>
    <p>Metas logradas: <b>${metasLogradas}</b> de ${metas.length}</p>
    <p>Avance promedio de planes:</p>
    <div class="bar"><div style="width:${avgMetas}%"></div></div>
    <p class="meta">Meta sugerida: ≥ 70% de avance promedio al cierre de semestre.</p>
  </div>

  <div class="card persp">
    <h3>2. Procesos internos (gestión)</h3>
    <p>Atenciones registradas: <b>${S.sessions.length}</b></p>
    <p>Atenciones con descripción completa: <b>${pctNotas}%</b></p>
    <p>Estudiantes activos sin atención en 30 días: <b class="${sinAtencion.length?'late':''}">${sinAtencion.length}</b></p>
    ${sinAtencion.length? '<p class="meta">'+sinAtencion.slice(0,8).map(s=>esc(s.codigo)).join(', ')+'</p>':''}
  </div>

  <div class="card persp">
    <h3>3. Familias y comunidad</h3>
    <p>Reuniones realizadas: <b>${reunRealizadas}</b> de ${reun.length}</p>
    <div class="bar"><div style="width:${pctReun}%"></div></div>
    <p class="meta">Meta sugerida: al menos una reunión por semestre con cada familia.</p>
  </div>

  <div class="card persp">
    <h3>4. Aprendizaje y desarrollo profesional</h3>
    <p>Horas de formación registradas: <b>${formacion.toFixed(1)}</b></p>
    <p>Tareas de gestión completadas: <b>${pctTareas}%</b></p>
    <div class="bar"><div style="width:${pctTareas}%"></div></div>
  </div>
  `;
}

/* ================= ESTUDIANTES ================= */
function vEst(){
  const lista = S.students.map(s=>`
    <div class="item">
      <b>${esc(s.codigo)}</b> <span class="tag">${esc(s.curso)}</span>
      <span class="tag ${s.estado==='Activo'?'ok':'warn'}">${esc(s.estado)}</span><br>
      <span class="meta">${esc(s.nee)} · Evaluado: ${esc(s.fechaEval||'—')} · Reevaluación: ${esc(s.fechaReeval||'—')}</span> ${semaforo(s)}<br>
      <span class="meta sens">${esc(s.obs)}</span>
      <div style="margin-top:4px">
        <button class="mini" onclick="verFicha('${s.id}')">Ficha</button>
        <button class="mini" onclick="cambiarEstado('${s.id}')">Cambiar estado</button>
        <button class="del" onclick="borrar('students','${s.id}')">Eliminar</button>
      </div>
    </div>`).join('') || '<p class="empty">Sin estudiantes registrados.</p>';

  return `
  <h2>Estudiantes PIE</h2>
  <div class="card">
    <h3>Nuevo estudiante</h3>
    <p class="meta">Usa código o iniciales, no nombres completos (protección de datos personales).</p>
    <input id="e_cod" placeholder="Código o iniciales (ej: M.G.R.)">
    <div class="row">
      <input id="e_curso" placeholder="Curso (ej: 3° Básico B)">
      <select id="e_estado"><option>Activo</option><option>Egresado</option><option>Retirado</option></select>
    </div>
    <select id="e_nee">${opts(TIPOS_NEE)}</select>
    <div class="row">
      <div><small class="meta">Fecha evaluación</small><input type="date" id="e_fe"></div>
      <div><small class="meta">Fecha reevaluación</small><input type="date" id="e_fr"></div>
    </div>
    <textarea id="e_obs" rows="2" placeholder="Observaciones generales"></textarea>
    <input id="e_prof" placeholder="Profesional que evaluó">
    <input id="e_inst" placeholder="Instrumentos, versión y fecha (ej: WISC-V, ENI)">
    <select id="e_elig"><option>Pendiente</option><option>Cumple criterios</option><option>No cumple</option></select>
    <input id="e_der" placeholder="Derivación a especialista (ej: neurólogo)">
    <div><small class="meta">Fecha de envío de derivación</small><input type="date" id="e_fder"></div>
    <textarea id="e_conf" rows="2" placeholder="Observaciones confidenciales (solo en ficha, oculto por defecto)"></textarea>
    <button class="btn" onclick="addEst()">Guardar estudiante</button>
  </div>
  <div class="card">${lista}</div>`;
}
function addEst(){
  const cod=document.getElementById('e_cod').value.trim();
  if(!cod){ alert('Ingresa un código o iniciales'); return; }
  S.students.push({id:uid(),codigo:cod,curso:document.getElementById('e_curso').value.trim(),
    estado:document.getElementById('e_estado').value,nee:document.getElementById('e_nee').value,
    fechaEval:document.getElementById('e_fe').value,fechaReeval:document.getElementById('e_fr').value,
    obs:document.getElementById('e_obs').value.trim(),prof:document.getElementById('e_prof').value.trim(),inst:document.getElementById('e_inst').value.trim(),elig:document.getElementById('e_elig').value,der:document.getElementById('e_der').value.trim(),fder:document.getElementById('e_fder').value,conf:document.getElementById('e_conf').value.trim()});
  save(); render();
}
function cambiarEstado(id){
  const s=S.students.find(x=>x.id===id);
  const orden=['Activo','Egresado','Retirado'];
  s.estado=orden[(orden.indexOf(s.estado)+1)%orden.length];
  save(); render();
}
function borrar(col,id){
  if(!confirm('¿Eliminar este registro?')) return;
  S[col]=S[col].filter(x=>x.id!==id); save(); render();
}

/* ================= ATENCIONES ================= */
function vAt(){
  const lista=[...S.sessions].filter(s=>!FILTRO||(nombreEst(s.estudiante)+' '+s.tipo+' '+s.desc).toLowerCase().includes(FILTRO)).sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(s=>`
    <div class="item">
      <b>${esc(s.fecha)}</b> · <span class="tag">${esc(s.tipo)}</span>
      <span class="tag">${esc(s.duracion)} min</span><br>
      <span class="meta">Estudiante: ${esc(nombreEst(s.estudiante))}</span><br>
      <span class="sens">${esc(s.desc)}</span>
      <div style="margin-top:4px"><button class="mini" onclick="editarAt('${s.id}')">Editar</button><button class="del" onclick="borrar('sessions','${s.id}')">Eliminar</button></div>
    </div>`).join('') || '<p class="empty">Sin atenciones registradas.</p>';

  return `
  <h2>Registro de atenciones</h2>
  <input placeholder="Buscar por estudiante, tipo o texto" value="${esc(FILTRO)}" onchange="FILTRO=this.value.toLowerCase();render()">
  <div class="card">
    <h3>Nueva atención</h3>
    <div class="row">
      <div><input type="date" id="a_f" value="${hoy()}"></div>
      <div><input type="number" id="a_d" placeholder="Minutos" value="45"></div>
    </div>

async function exportar(){
  const pw = prompt('Crea una contraseña para este respaldo (mínimo 6 caracteres). Guárdala aparte: sin ella el respaldo no se puede abrir.');
  if(pw===null) return;
  if(pw.length<6){ alert('La contraseña debe tener al menos 6 caracteres.'); return; }
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const clave = await deriveKey(pw, salt);
  const c = await cifrar(clave, JSON.stringify(S));
  const out = JSON.stringify({formato:'cmi-pie-respaldo', v:2, salt:b64(salt), iv:c.iv, ct:c.ct});
  const blob = new Blob([out],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'respaldo_cifrado_cmi_pie_'+hoy()+'.json';
  a.click();
}
function importar(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async ()=>{
    try{
      const obj = JSON.parse(r.result);
      let nuevo;
      if(obj.formato==='cmi-pie-respaldo'){
        const pw = prompt('Contraseña del respaldo:');
        if(pw===null){ input.value=''; return; }
        const clave = await deriveKey(pw, unb64(obj.salt));
        nuevo = JSON.parse(await descifrar(clave, obj.iv, obj.ct));
      } else if(obj.students){
        if(!confirm('Este respaldo no está cifrado. Se importará tal cual. ¿Continuar?')) { input.value=''; return; }
        nuevo = obj;
      } else {
        throw new Error('formato');
      }
      if(!confirm('Esto reemplaza los datos actuales. ¿Continuar?')){ input.value=''; return; }
      S = {students:[],sessions:[],goals:[],meetings:[],tasks:[],formacion:0, ...nuevo};
      save(); render(); alert('Respaldo importado');
    }catch(e){
      alert('No se pudo importar: archivo no válido o contraseña incorrecta.');
    }
    input.value='';
  };
  r.readAsText(f);
}
function borrarTodo(){
  if(!confirm('¿Borrar TODOS los datos y el PIN? Esta acción no se puede deshacer.')) return;

function semaforo(s){
  if(!s.fechaReeval) return '<span class="tag warn">Sin fecha de reevaluación</span>';
  const d=Math.ceil((new Date(s.fechaReeval)-new Date(hoy()))/86400000);
  const rojo='background:#fee2e2;color:#b91c1c';
  if(d<0) return '<span class="tag" style="'+rojo+'">Reevaluación vencida</span>';
  if(d<=7) return '<span class="tag" style="'+rojo+'">Vence en '+d+' d (alerta 7)</span>';
  if(d<=30) return '<span class="tag warn">Vence en '+d+' d (alerta 30)</span>';
  if(d<=60) return '<span class="tag" style="background:#fef9c3;color:#854d0e">Vence en '+d+' d (alerta 60)</span>';
  return '<span class="tag ok">Vigente ('+d+' d)</span>';
}
function calcDur(){
  const i=document.getElementById('a_hi'), t=document.getElementById('a_ht');
  if(!i||!t||!i.value||!t.value) return 0;
  const [h1,m1]=i.value.split(':').map(Number);
  const [h2,m2]=t.value.split(':').map(Number);
  return Math.max(0,(h2*60+m2)-(h1*60+m1));
}

/* Exportación a calendario (.ics): solo códigos, sin nombres */
function icsEsc(s){ return String(s??'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function icsEvento(id, fecha, titulo, desc){
  const stamp = new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  return ['BEGIN:VEVENT','UID:'+id+'@cmi-pie','DTSTAMP:'+stamp,
    'DTSTART;VALUE=DATE:'+fecha.replace(/-/g,''),
    'SUMMARY:'+icsEsc(titulo),'DESCRIPTION:'+icsEsc(desc),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Recordatorio CMI PIE','TRIGGER:-P1D','END:VALARM',
    'END:VEVENT'];
}
function exportarICS(){
  if(!confirm('Se descargará un calendario con códigos de estudiantes y fechas. ¿Continuar?')) return;
  const ev=[];
  S.students.filter(s=>s.fechaReeval).forEach(s=>ev.push(...icsEvento('reev-'+s.id, s.fechaReeval, 'Reevaluación PIE: '+s.codigo, 'Revisar evaluación vigente y plazos según normativa.')));
  S.meetings.filter(r=>r.estado==='Programada'&&r.fecha).forEach(r=>ev.push(...icsEvento('reun-'+r.id, r.fecha, 'Reunión: '+nombreEst(r.estudiante), r.participantes+' · '+(r.tema||''))));
  S.tasks.filter(t=>!t.done&&t.vence).forEach(t=>ev.push(...icsEvento('tar-'+t.id, t.vence, 'Tarea: '+t.desc, t.tipo)));
  S.goals.filter(g=>g.plazo&&g.progreso<100).forEach(g=>ev.push(...icsEvento('meta-'+g.id, g.plazo, 'Plazo de meta: '+nombreEst(g.estudiante), g.meta)));
  if(!ev.length){ alert('No hay fechas para exportar.'); return; }
  const cal=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CMI PIE//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH',...ev,'END:VCALENDAR'].join('\r\n');
  const blob=new Blob([cal],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='cmi_pie_calendario_'+hoy()+'.ics'; a.click();
}

boot();
</script>
</body>
</html>
